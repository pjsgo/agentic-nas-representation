representation_version: local_position_supplement_v1
operator_profile: self_contained_equations
architecture: ConvS2S
scope:
  included: [explicit_position_table_lookup, token_position_addition]
  excluded: [automatic_position_numbering, token_lookup, training, incremental_cache, full_model]
interface:
  call: convs2s_position(words, positions, table)
  words: 'CPU float32/float64 [B,T,D], finite token vectors, positive dimensions'
  positions: 'CPU int64 [B,T], 0 <= positions < P; explicit caller IDs'
  table: 'finite [P,D], same dtype/device as words; learned values supplied, no training here'
  output: '[B,T,D], same dtype/device as words'
  padding: 'No implicit zeroing or indexing. Caller supplies valid IDs/table rows even at padded slots. Source mask remains a separate unchanged block argument; no target padding support.'
  decoder: 'Caller supplies already shifted target words/positions; source and target tables are independent.'
operators:
  lookup: 'position[b,t,d] = table[positions[b,t],d]'
  add: 'embedding[b,t,d] = words[b,t,d] + position[b,t,d]'
graph:
- {id: position_lookup, op: lookup, inputs: [positions, table], outputs: [position]}
- {id: position_add, op: add, inputs: [words, position], outputs: [embedding]}
implementation: position.py:convs2s_position
connection: 'convs2s_forward supplies embedding to existing Model.source_embedding / Model.target_embedding; existing block unchanged.'

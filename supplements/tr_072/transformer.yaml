representation_version: local_position_supplement_v1
operator_profile: self_contained_equations
architecture: Transformer
scope:
  included: [token_vector_scaling, sinusoidal_absolute_position, token_position_addition]
  excluded: [token_lookup, learned_position_variant, automatic_position_numbering, dropout_training, full_model]
interface:
  call: transformer_position(words, positions)
  words: 'CPU float32/float64 [B,T,D], finite UNSCALED token vectors; positive B,T, even positive D'
  positions: 'CPU int64 [B,T], nonnegative explicit positions; zero is first unpadded position convention'
  output: '[B,T,D], same dtype/device as words'
  padding: 'No implicit suppression of PE at padded slots; caller controls positions and attention exclusion mask. Baseline UnitA accepts a shared [T,T] mask, not independent per-batch padding masks.'
operators:
  scale: 'scaled = sqrt(D)*words'
  sinusoidal: 'PE[b,t,2*i]=sin(positions[b,t]/10000**(2*i/D)); PE[b,t,2*i+1]=cos(positions[b,t]/10000**(2*i/D)); 0<=i<D/2'
  add: 'embedding = scaled + PE'
graph:
- {id: token_scale, op: scale, inputs: [words], outputs: [scaled]}
- {id: position_sinusoidal, op: sinusoidal, inputs: [positions], outputs: [PE]}
- {id: position_add, op: add, inputs: [scaled, PE], outputs: [embedding]}
implementation: position.py:transformer_position
connection: 'transformer_forward supplies embedding to existing UnitA.x, D=8 float32; mask unchanged. No claim baseline block is original paper full model.'

unresolved:
- GPU IO schedule, backward 재계산과 전체 block은 양쪽 core 매핑의 범위 밖이다.
- 슬라이드 A 분류는 유지한다. 계산 함수 보존과 실행 알고리즘 변경을 구분한다.

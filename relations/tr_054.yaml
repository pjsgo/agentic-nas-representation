  required: false
  reason: Descriptive relation and explicit scope fit local_transition_v1; no operator
    semantics changed.
motivation: 정확한 attention의 계산을 유지하면서 HBM에 큰 score/probability 행렬을 쓰고 읽는 비용을 줄인다.
conditions:
- 같은 QKV, scale, mask와 dropout 조건에서 attention 함수를 비교해야 한다. 실수 수식의 동등성이 bitwise 동일함을
  뜻하지 않는다.
- 독립 block softmax의 단순 합은 전역 softmax와 다르다. 누적 정규화 통계와 출력 재척도가 필요하다.
- 공식 Triton 함수는 CUDA fp16/bfloat16 및 head dimension<=128을 요구한다. 기존 CPU float32 block의
  직접 실행 대체가 아니다.
expected_effects:
- 전체 attention 행렬의 저장을 피하고 HBM traffic을 줄인다. dense attention의 산술량은 여전히 길이 제곱 규모다.
- 속도와 메모리 효과는 hardware, tile 및 kernel 조건에 의존하며 여기서 측정하지 않았다.
tradeoffs:
- tile 처리와 안정적인 online softmax 구현이 복잡해진다. backward 재계산은 저장량을 줄이는 대신 재계산을 요구한다.
- 부동소수점 계산 순서와 지원 mask 조건이 달라질 수 있다.

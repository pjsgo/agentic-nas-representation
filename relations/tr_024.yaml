motivation: 한 문장을 여러 attention 관점으로 표현하는 아이디어를 비교한다.
conditions:
- I? 유지. SSA는 [B,R,D] 문장 요약이며 Transformer는 token별 output을 낸다. SSA는 BiLSTM/penalty/classifier를
  제외하고 paper eq6-7을 따른다. 저자 코드의 bias/finite mask sentinel까지 동일하다는 주장은 없다.
- 기대 효과는 설명이며 실측 성능 결과나 실행 변환 인증이 아니다.
expected_effects:
- 다중 관점 요약과 token 간 문맥화의 공통점 및 차이를 구별한다.
tradeoffs:
- 문장 요약 행렬과 token별 표현은 일대일 대응하지 않으며 head 수 일치도 가정하지 않는다.

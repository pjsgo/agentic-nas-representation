  operation: descriptive_comparison
  mechanism: current/previous input causal gate affine, tanh candidate와 sigmoid update/output,
    fo cell pooling 및 external history를 Transformer pairwise attention에 대한 대안으로 설명한다.
    선택 QRNN의 update gate는 새 candidate에 곱해진다.

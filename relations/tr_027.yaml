motivation: 순차 처리 병목에 대한 두 대안을 비교한다.
conditions:
- X? 유지. QRNN cell=update*z+(1-update)*old이고 window=2 연속 실행은 final_cell과 final_x가
  필요하다. Transformer에는 이 carry 계약이 없다. CUDA/zoneout/padding 및 실행 성능 비교는 제외한다.
- 기대 효과는 설명이며 실측 성능 결과나 실행 변환 인증이 아니다.
expected_effects:
- 부분 순환을 유지하는 대안과 attention 기반 대안의 상태 경계를 설명한다.
tradeoffs:
- QRNN의 순환 pooling 의존성과 dense attention의 길이 제곱 비용은 서로 다른 제약이다. 측정된 성능 비교가 아니다.

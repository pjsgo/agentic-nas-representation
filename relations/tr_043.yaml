motivation: expert 선택을 top-1로 단순화하여 routing과 expert 통신 부담을 줄인다.
conditions:
- source의 selected-top-k softmax와 target의 전체 expert softmax 후 top-1은 다르다. source k=1을
  설정하는 것만으로 Switch가 되지 않는다.
- capacity, token 순서, padding 및 overflow 처리 계약을 맞춰야 한다.
expected_effects:
- token당 선택 expert 수를 하나로 줄여 활성 expert 연산과 통신 부담을 낮춘다.
tradeoffs:
- expert 불균형과 capacity 초과 token 누락이 생기며 보조 load-balance loss 및 분산 실행 비용이 남는다.
changes:
- before_units:
  - factors.sparse_moe_router
  - factors.sparse_moe_topk_gate
  after_units:
  - factors.switch_router
  operation: descriptive_correspondence
  mechanism: 입력별 linear router는 유지하고 selected-top-k softmax를 full-expert softmax 후
    top-1 선택으로 바꾼다. 선택 gate는 1로 재정규화하지 않는다.
  state_and_resource_contract: 설명 대응이며 출력 동등성이나 가중치 이식을 뜻하지 않는다.
  mapping_status: mapped_scoped
- before_units: []
  after_units:
  - factors.switch_capacity_dispatch
  operation: descriptive_correspondence
  mechanism: expert마다 입력 순서의 valid token을 C개까지 받아들인다. padding은 slot을 소비하지 않으며 overflow는
    재routing하지 않는다.
  state_and_resource_contract: C=max(min_capacity,min(T,floor(T*capacity_factor/E))).
    T에는 padding 행도 포함한다. counter는 호출마다 초기화한다.
  mapping_status: mapped_scoped
- before_units:
  - factors.sparse_moe_experts
  after_units:
  - factors.switch_experts
  operation: descriptive_correspondence
  mechanism: 독립 expert의 bias-free ReLU FFN 개념을 유지하되 source의 (H/D)^(-0.5) width scaling은
    제거한다.
  state_and_resource_contract: 설명 대응이며 출력 동등성이나 가중치 이식을 뜻하지 않는다.
  mapping_status: mapped_scoped
- before_units:
  - factors.sparse_moe_combine
  after_units:
  - factors.switch_combine
  operation: descriptive_correspondence
  mechanism: 선택된 expert 출력의 gate 가중합을 유지한다. target은 수용된 top-1만 합산하고 padding/overflow
    branch 출력은 0이다.
  state_and_resource_contract: 설명 대응이며 출력 동등성이나 가중치 이식을 뜻하지 않는다.
  mapping_status: mapped_scoped

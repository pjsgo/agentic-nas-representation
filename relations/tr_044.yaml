motivation: dense FFN을 sparse expert FFN으로 바꾸어 token당 활성 계산을 제한하면서 파라미터 용량을 늘린다.
conditions:
- Switch 논문의 실제 모델은 T5 기반이다. 일반 Transformer에서의 구조 계승 표기를 보존하되 모든 세부 설정이 같다고 주장하지 않는다.
- 현재 대상은 Switch FFN core이다. residual과 attention은 core 밖이다.
- target은 단일 group의 입력 순서 dispatch이며 전체 expert 확률을 유지한다. group 크기 T는 padding도 포함하지만
  padding은 capacity slot을 소비하지 않는다.
expected_effects:
- dense FFN 대신 조건부 expert 용량을 사용할 수 있다.
tradeoffs:
- expert 저장 공간, routing, capacity와 통신 비용이 추가된다. 속도나 품질은 보장하지 않는다.
changes:
- before_units:
  - factors.stage_b
  - factors.expand_a
  - factors.activate_a
  - factors.contract_a
  after_units:
  - factors.switch_experts
  operation: descriptive_correspondence
  mechanism: 단일 dense ReLU FFN을 expert별 독립 bias-free ReLU FFN으로 바꾼다.
  state_and_resource_contract: 출발 FFN bias와 fixed float32 차원은 target float64 [T,D]
    expert core와 다르다.
  mapping_status: mapped_scoped
- before_units: []
  after_units:
  - factors.switch_router
  - factors.switch_capacity_dispatch
  - factors.switch_combine
  operation: descriptive_correspondence
  mechanism: FFN 교체에 필요한 full-softmax top-1 router, capacity slot과 selected-gate combine을
    추가한다.
  state_and_resource_contract: source [B,T,E] block stream의 token flattening과 outer
    residual 통합은 실행하지 않는다. padding/overflow의 0은 expert branch 출력뿐이다.
  mapping_status: mapped_scoped
preserve:
- 논문 모델 수준의 attention, residual stream 및 Transformer block 골격. 현재 FFN core에서 직접 확인한
  보존 부품은 아니다.

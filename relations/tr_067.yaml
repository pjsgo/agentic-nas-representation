motivation: 고정 크기 recurrent state의 표현력 병목에 대응한다.
conditions:
- TTT-Linear와 TTT-MLP를 구분하며 복원 YAML이 선언한 variant만 매핑한다. 외부 모델 전체를 test-time 재학습하는
  의미가 아니다.
- 실제 대상은 single-head TTT-Linear이고 T%chunk_size=0인 완전 chunk만 허용한다. chunk 시작 W/b에서 gradient를
  계산하며 prefix별 갱신 뒤 query를 읽는다.
- TTT의 inner update는 설명 대상 계산이다. 이 관계 세션에서는 그 수치 계산이나 학습을 실행하지 않았다.
expected_effects:
- 학습 가능한 내부 state update로 context 구조를 저장한다.
tradeoffs:
- 내부 gradient 계산, 학습률과 mini-batch 경계, memory I/O 비용이 추가된다.

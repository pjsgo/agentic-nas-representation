- before_units:
  - factors.sparse_local_pattern
  - factors.sparse_strided_pattern
  - factors.sparse_pattern
  after_units:
  - factors.lf_local_window
  - factors.lf_global_keys
  operation: descriptive_correspondence
  mechanism: 한 causal factor 선택을 양방향 window와 global key의 중복 없는 합집합으로 변경한다. strided
    factor를 dilated window와 동일시하지 않는다.
  state_and_resource_contract: 대상에 valid와 global_mask가 추가된다. causal 제약은 보존되지 않는다.
  mapping_status: mapped_scoped

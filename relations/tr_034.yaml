  - factors.sparse_masked_scores
  - factors.sparse_probabilities
  - factors.sparse_output
  after_units:
  - factors.lf_ordinary_attention
  - factors.lf_global_attention
  - factors.lf_output_select
  operation: descriptive_correspondence
  mechanism: 일반 query는 local QKV로 window와 global key를 함께 정규화한다. global query는 별도의
    global QKV로 모든 valid key를 읽고 해당 위치의 출력을 대체한다.
  state_and_resource_contract: 출발 float64 QKV 입력과 대상 float32 hidden-state 입력은 직접 호환되지
    않는다. 대상 padding 출력은 zero, 지속 상태는 없다.
  mapping_status: mapped_scoped
- before_units: []
  after_units:
  - factors.lf_local_projection
  - factors.lf_global_projection
  operation: descriptive_correspondence
  mechanism: 대상에 실제 선언된 독립 local/global 투영을 연결한다. 출발 core에는 투영 부품이 없으므로 source ID를
    만들지 않는다.
  state_and_resource_contract: 대상 여섯 Linear의 weight와 bias 총 12개 파라미터. 출발은 외부 QKV,
    등록 파라미터 없음.
  mapping_status: target_only_source_out_of_scope
preserve:
- 허용된 연결 위에서 scaled dot-product softmax와 value 가중합을 수행하는 원리
- 희소 접근으로 전체 쌍의 연결을 줄이는 아이디어. 동일 코드 또는 전체 구조의 직접 계승을 주장하지 않는다.

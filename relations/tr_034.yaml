unresolved:
- 양쪽 전체 모델 계보는 현재 core보다 넓다. dilation, layer schedule 및 kernel 대응은 범위 밖이다.
specification_proposal:
  required: false
  reason: Descriptive relation and explicit scope fit local_transition_v1; no operator
    semantics changed.
motivation: 희소 연결 아이디어를 긴 문서의 양방향 문맥과 과제별 전역 정보 전달에 적용한다.
conditions:
- 선택한 대상은 양방향 non-dilated core이다. causal local/strided 출발 core의 출력 보존 변환이 아니다.
- global_mask는 valid의 부분집합이고 local과 global key 중복을 제거한다.
- 선형 비용 기대는 window와 global token 수가 길이에 따라 증가하지 않고 sparse kernel을 사용할 때의 조건이다.
expected_effects:
- 지역 문맥과 지정 전역 위치를 연결한다. 적은 전역 위치로 장거리 정보 전달을 가능하게 한다.
- 논문의 기대 효과이며 이번 세션에서 성능을 측정하지 않았다.
tradeoffs:
- 전역 위치 선택은 과제 의존적이다. 전역 token 수가 증가하면 연결 비용이 증가한다.
- 별도의 global QKV 투영 파라미터가 추가된다. dense mask 실현만으로 속도 향상을 주장할 수 없다.

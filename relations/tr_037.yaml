format_version: local_transition_v1
transition_id: tr_037
source_architecture: Transformer
target_architecture: Linear Transformer
relation_type: A
inferred: false
motivation: Replace quadratic score matrix with fixed-size prefix state for causal attention.
conditions:
- CPU float32 inference only; B>=1 and T>=1; two heads and four dimensions per head
- Explicit transition from arbitrary exclusion mask to inclusive causal prefixes; padding masks unsupported
- No scaling of q before ELU+1; no softmax
expected_effects:
- fixed_size_attention_carry
- causal_chunk_continuation
tradeoffs:
- Different attention kernel; equality with original softmax block is not expected
- Restricts mask interface and adds external carry
- No measured speed or quality claim
changes:
- before_units:
  - scale_value
  - scale_q
  - turn_k
  - score_a
  - mask_shape_a
  - mask_shape_b
  - apply_mask
  - prob_a
  - mix_a
  after_units:
  - linear_causal_core
  operation: replace_subgraph
  mechanism: S_t=S_prev+outer(phi(k_t),v_t); Z_t=Z_prev+phi(k_t); out_t=(phi(q_t) dot S_t)/(phi(q_t) dot Z_t+1e-6)
  wiring: order_q/order_k/order_v -> linear_causal_core -> order_mix
  state: external S[B,2,4,4] and Z[B,2,4]; update before query readout
  interface: replace mask input with optional S/Z; return y and updated carries
  mapping_status: mapped_scoped
preserve:
- project_a, partition_a, shape_q, shape_k, shape_v, order_q, order_k, order_v
- order_mix, join_a, project_b
- merge_a, normalize_a, stage_b, expand_a, activate_a, contract_a, merge_b, normalize_b
- p0 through p11 parameter shapes, requires_grad, packed independent q/k/v slices, repeated-call weight sharing
mapping_status: complete_scoped
record_status: complete
unresolved:
- Full model/training/speed excluded
- Local operator extension, not Common Schema certification

format_version: local_transition_v1
transition_id: tr_050
source_architecture: S4
target_architecture: H3
relation_type: C
inferred: false
motivation: Add multiplicative key/value association and query-dependent recall around SSM memory.
conditions:
- Component inheritance does not imply that an entire S4 layer or its weights convert directly into H3.
- Existing S4 core is rank-one DPLR; H3 selected diagonal memory is S4D, not that same low-rank core.
expected_effects:
- Retain structured recurrent temporal memory inside a nonlinear gated block.
- Use shift processing to associate local keys and values before long memory.
tradeoffs:
- Additional projections, two recurrent state families and multiplicative interactions.
- Removing DPLR terms changes dynamics; no numerical equivalence or parameter bijection.
- Input-independent SSM kernels allow convolution but gates alone do not make state transitions selective.
changes:
- before_units:
  - factors.prepare
  - factors.sequence_scan
  after_units:
  - graph.discretize
  - graph.diagonal_memory
  operation: component_specialization
  mechanism: Replace full conjugate-completed rank-one DPLR dynamics with diagonal complex pairs; retain continuous
    A/B, step size and bilinear discretization concept.
  wiring: Memory now consumes shifted-key times value rather than the original S4 input.
  state: H3 diagonal carry is complex64 [B,2,2]; it is not a direct copy of S4 full complex carry.
  mapping_status: mapped_scoped
- before_units: []
  after_units:
  - graph.q_proj
  - graph.k_proj
  - graph.v_proj
  - graph.shift_memory
  - graph.shift_skip
  - graph.value_gate
  - graph.query_gate
  - graph.output_projection
  operation: add_surrounding_components
  mechanism: Shift keys, multiply with values, run diagonal memory, multiply by query, then mix output channels.
  wiring: u feeds independent Q/K/V projections; shift and diagonal carries are separate.
  interface: H3 maps [B,T,2] plus two carries to output plus both final carries.
  mapping_status: mapped_scoped
preserve:
- Causal update-before-readout state-space computation and a direct feedthrough path.
- Learned time scales and linear temporal memory inside the memory component.
mapping_status: complete_scoped
record_status: complete

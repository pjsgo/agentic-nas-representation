motivation: 입력 위치 임베딩 대신 거리에 선형적인 head별 bias를 score에 넣어 길이 외삽을 지향한다.
conditions:
- 원 논문의 causal attention 범위. bidirectional 변형은 별도 정의가 필요하다.
- bias는 scaled QK에 더하고 softmax 전에 mask와 결합한다. 고정 slope이며 학습 파라미터가 아니다.
- source의 임의 제외 mask를 target의 causal mask로 일반적으로 보존하지 않는다. padding 및 양방향 attention
  제외.
- H가 2의 거듭제곱이 아니면 공식 코드의 slope 이어붙이기 순서를 유지한다.
expected_effects:
- 가까운 key를 선호하는 서로 다른 head별 기울기를 부여한다. 길이 외삽 결과는 논문 보고이며 이 세션은 측정하지 않는다.
tradeoffs:
- 거리 선호가 고정되고 head별 bias 저장 또는 생성 비용이 든다.
- ALiBi 추가만으로 모든 길이와 과제의 성능 개선을 보장하지 않는다.
changes:
- before_units:
  - factors.scale_q
  - factors.score_a
  - factors.apply_mask
  - factors.prob_a
  after_units:
  - factors.alibi_scaled_qk
  - factors.alibi_add_bias
  - factors.alibi_causal_mask
  - factors.alibi_softmax
  operation: descriptive_correspondence
  mechanism: scaled score에 head별 음의 거리 bias를 더한 뒤 causal mask와 softmax를 적용한다.
  state_and_resource_contract: 공식 코드는 key 위치에 slope를 곱한다. causal row의 -slope*(i-j)와
    row 상수만 달라 softmax는 같지만 raw logits는 다르다.
  mapping_status: mapped_scoped
- before_units:
  - factors.mix_a
  after_units:
  - factors.alibi_value_mix
  operation: descriptive_correspondence
  mechanism: value 경로는 위치 회전이나 상대 value 추가 없이 확률 가중합을 유지한다.
  state_and_resource_contract: 대상 float32 projected QKV, [B,H,T,D]에서 [B,H,T,Dv]로 출력.
    offset은 같은 self-attention stream의 연속 query slice이며 cache 관리는 제외.
  mapping_status: mapped_scoped
- before_units: []
  after_units:
  - factors.alibi_slopes
  - factors.alibi_distance
  - factors.alibi_bias
  operation: descriptive_correspondence
  mechanism: head별 고정 slope와 명시 offset의 부호 있는 거리로 bias를 구성한다.
  state_and_resource_contract: 학습 파라미터 없음. 공식 코드의 plain tensor와 달리 local core는 slopes
    하나를 persistent buffer로 등록한다. 변경 없이 같은 H의 canonical slope만 로드한다.
  mapping_status: target_only_source_out_of_scope
preserve:

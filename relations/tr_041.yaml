motivation: 평균 제거 없이 크기를 정규화하여 정규화 계산을 단순화한다.
conditions:
- 마지막 feature 축의 full RMS, scale-only 변형. pRMSNorm은 제외한다.
- 대상 epsilon은 sqrt 뒤에 더한다. 출발은 variance의 sqrt 안에 더하므로 같은 eps를 복사해도 동일 계산이 아니다.
expected_effects:
- 평균과 중심화 계산을 제거한다. 속도 향상은 이 세션에서 측정하지 않았다.
tradeoffs:
- 평행 이동 불변성을 잃으며 기존 LayerNorm 출력과 같지 않다.
- 대상 bias=False는 선택 구현 설정이며 RMSNorm 논문 전체가 bias를 금지한다는 뜻이 아니다.

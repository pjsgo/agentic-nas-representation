  operation: descriptive_correspondence
  mechanism: centered variance 정규화와 gain/bias를 uncentered RMS 정규화와 gain만으로 바꾼다.
  state_and_resource_contract: 출발 다중 trailing 축 중 단일 마지막 축에 대응한다. 대상 scale은 호출자가 공급하며
    beta는 제거된다.

motivation: 잔차 가지의 정규화 위치를 옮겨 깊은 Transformer의 최적화와 초기 gradient 문제에 대응한다.
conditions:
- eval 단일 encoder block, dropout identity, ReLU FFN.
- 출발 float32 고정 E=8,H=2에서 대상 float64 가변 차원으로 바뀐다. 출발 [T,T] exclusion mask와 대상 [B,T]
  key-padding mask는 일반적으로 동등하지 않다.
- 전체 Pre-LN stack의 마지막 LayerNorm은 현재 block에 포함되지 않는다.
expected_effects:
- 논문은 초기 gradient 안정화와 warm-up 의존 완화를 분석한다. 현재 forward 관계는 학습 효과를 인증하지 않는다.
tradeoffs:
- norm 위치 변경은 출력과 gradient를 바꾸며 기존 가중치를 그대로 옮기는 동등 변환이 아니다.

motivation: 모델 파라미터 밖의 corpus 정보를 token 예측에 사용한다.
conditions:
- 현재 RETRO 입력은 이미 encoding된 neighbours와 positional logits이다. 검색과 encoder를 수행했다고 보지
  않는다.
- 출발 Transformer는 encoder block이다. 대상의 autoregressive decoder 전체를 출발 YAML이 제공한다고 가정하지
  않으며 attention 부품만 대응한다.
expected_effects:
- 검색된 정보를 decoder 표현에 주입한다.
tradeoffs:
- 검색 corpus, index, encoder 비용과 retrieval 품질 의존이 남는다. 현재 YAML은 그 계산을 포함하지 않는다.

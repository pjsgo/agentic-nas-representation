motivation: 상대 거리 의존성을 Q와 K의 위치별 회전으로 표현한다. 슬라이드의 아이디어 계승 추론이며 직접 계승 입증이 아니다.
conditions:
- 회전 차원은 짝수이고 인접 even/odd 쌍, base=10000, Q/K에 공통 좌표를 사용한다.
- 현재 RoPE core는 명시 위치와 서로 다른 Q/K 길이를 허용하지만 mask는 제외한다.
expected_effects:
- 회전된 Q/K 내적에 상대 위치를 반영하며 별도 학습 상대 테이블을 요구하지 않는다.
tradeoffs:
- 회전과 삼각함수 계산 및 위치 좌표 계약이 필요하다.
- 장문 품질이나 개별 attention score의 단조 거리 감소는 보장하지 않는다.

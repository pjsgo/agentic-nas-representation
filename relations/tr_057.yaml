motivation: 선형 attention의 순환 누적 관점에서 RWKV를 비교한다.
conditions:
- 원본 I? 유지. RWKV v4를 대상으로 하며 논문이 직접 지목하는 AFT 영향과 이 추론 관계를 구분한다.
- 출발 core는 기존 in-place S/Z 계약이고 대상은 명시적 비변이 반환 상태이다. 상태 aliasing까지 보존하는 변환이 아니다.
expected_effects:
- 전체 KV cache 없이 순환 추론을 구성하는 방식을 보여준다.
tradeoffs:
- 정보 압축과 channel-wise 표현의 제약이 있고 linear-attention state와 RWKV state는 호환되지 않는다.

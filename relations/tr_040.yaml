motivation: token 쌍 QK 내적 없이 alignment를 합성할 수 있는지 탐구한다.
conditions:
- 선택 대상은 dense_minus이며 random, factorized, mixture 변형은 포함하지 않는다.
- 대상 w2[D,L]는 head 간 공유하며 N<=L prefix를 사용한다. 출발 exclusion mask와 대상 allowed mask는 polarity
  및 batch shape가 다르다.
expected_effects:
- pairwise QK score를 token별 logits network로 대체한다.
tradeoffs:
- dense N by N logits와 집계 비용은 남는다. 선형 복잡도 attention이라고 주장하지 않는다.
- 최대 길이 L과 위치별 logits 파라미터에 의존하며 입력 간 직접 pair 상호작용은 제거된다.

  operation: descriptive_correspondence
  mechanism: QK 내적을 token별 두 층 ReLU logits와 value projection으로 대체한다.
  state_and_resource_contract: 합쳐진 출발 QKV projection은 부분 대응이다. 대상 no-bias, head-shared
    w2, runtime sqrt(D) scaling 없음.

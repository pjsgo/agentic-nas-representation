motivation: convolution decoder에서도 입력 문장에 대한 내용 기반 조회가 필요하다.
conditions:
- 내용 기반 encoder 조회 부품의 역할 대응이며 score 함수를 동일시하지 않는다. Bahdanau mask True=valid와 ConvS2S
  mask True=exclude를 구별한다. 현재 encoder/decoder input boundary와 residual/projection
  차이는 weight 이식 대상이 아니다.
- 기대 효과는 설명이며 실측 성능 결과나 실행 변환 인증이 아니다.
expected_effects:
- attention 부품 계승과 recurrent backbone 교체를 구별한다.
tradeoffs:
- source-target attention의 계산·메모리 비용이 남으며 번역 시스템 전체는 대응 범위 밖이다.
changes:
- before_units:
  - additive_attention/energy
  - additive_attention/weights
  - additive_attention/context
  after_units:
  - graph.convs2s_encoder_attention
  - graph.convs2s_length_scaled_context
  operation: descriptive_correspondence
  mechanism: Bahdanau additive energy/weights/context를 ConvS2S의 projected decoder-plus-embedding
    query dot score, source-axis softmax와 encoder-value aggregation에 대응한다. ConvS2S에는
    query sqrt(0.5)와 context sqrt(valid length) scaling이 있다.
  mapping_status: mapped_scoped
  cardinality: semantic_many_to_many_not_tensor_parameter_or_state_identity
  state_and_resource_contract: 내용 기반 encoder 조회 부품의 역할 대응이며 score 함수를 동일시하지 않는다. Bahdanau
    mask True=valid와 ConvS2S mask True=exclude를 구별한다. 현재 encoder/decoder input boundary와
    residual/projection 차이는 weight 이식 대상이 아니다.
preserve:
- decoder query에 따라 encoder 문맥을 선택하는 역할

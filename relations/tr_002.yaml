  - ../architectures/neural-lm/sources.yaml
  - ../architectures/rnn-lm/sources.yaml
motivation: 고정 context window의 한계에 대응한다.
conditions:
- Neural LM은 공급된 most-recent-first 고정 window이고 RNN LM은 time-first 토큰과 h0를 받는다. full
  vocabulary softmax 역할만 공유하며 class output, training, context 구성, 자동 reset은 없다. P?를
  유지한다.
- 기대 효과는 설명이며 실측 성능 결과나 실행 변환 인증이 아니다.
expected_effects:
- 고정 window 밖의 이력이 state를 통해 영향을 줄 수 있다.
tradeoffs:
- 순차 계산과 장기 정보 소실이 남는다. 학습 성능 우위는 검증하지 않았다.
changes:
- before_units:
  - factors.neural_lm_lookup
  - factors.neural_lm_context
  - factors.neural_lm_hidden
  - factors.neural_lm_direct
  - factors.neural_lm_readout
  - factors.neural_lm_softmax
  after_units:
  - factors.rnn_lm_token_map
  - factors.rnn_lm_recurrent
  - factors.rnn_lm_carry
  - factors.rnn_lm_readout
  - factors.rnn_lm_softmax
  operation: descriptive_correspondence
  mechanism: 공유 lookup의 고정 K개 문맥을 순서대로 연결해 tanh hidden 및 direct W/readout을 계산하는 LM을,
    현재 token one-hot map과 sigmoid hidden carry 및 flat-vocabulary readout LM에 대응한다.
    대상에는 별도 embedding+projection과 direct W branch가 없다.
  mapping_status: mapped_scoped
  cardinality: semantic_many_to_many_not_tensor_parameter_or_state_identity
  state_and_resource_contract: Neural LM은 공급된 most-recent-first 고정 window이고 RNN LM은
    time-first 토큰과 h0를 받는다. full vocabulary softmax 역할만 공유하며 class output, training,
    context 구성, 자동 reset은 없다. P?를 유지한다.

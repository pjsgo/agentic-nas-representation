unresolved:
- 원 GQA 논문 저자의 공개 구현은 이번 조사에서 확인하지 못했다. 슬라이드 69쪽도 GQA 코드가 제3자 구현임을 명시한다. 공식 Llama
  코드는 공유 KV의 보조 근거이며 원 논문 구현으로 둔갑시키지 않는다.
- 투영 파라미터 공유와 checkpoint 전환, 전체 decoder 매핑은 이 core로 완료됐다고 주장하지 않는다.
specification_proposal:
  required: false
  reason: Descriptive relation and explicit scope fit local_transition_v1; no operator
    semantics changed.
motivation: query head의 표현을 유지하면서 공유 K/V head 수를 줄여 autoregressive decoding의 KV 저장과
  읽기 비용을 낮춘다.
conditions:
- H query heads를 G KV groups에 대응시킨다. 균등 그룹은 H가 G로 나누어져야 하며 각 query가 읽는 KV group을 명시한다.
- G=H는 MHA, G=1은 MQA이다. 중간 G는 서로 다른 query들이 같은 KV를 공유한다.
- checkpoint 전환 시 그룹 내 K/V projection 평균과 추가 학습은 논문의 별도 절차이며 출력 보존 변환이 아니다.
expected_effects:
- 같은 batch, 길이와 head dimension에서 KV 저장 요소 수는 이상적으로 MHA의 G/H 비율이다. query head 수와 score
  집계는 그대로 남는다.
- 학습 후 품질과 속도의 절충은 논문 결과이지 이 세션의 재현 결과가 아니다.
tradeoffs:
- 독립 K/V projection의 자유도가 줄어든다. 평균 checkpoint는 원래 MHA와 일반적으로 동일 출력을 내지 않는다.
- cache 구현과 sharding, 실제 KV 복제 방식에 따라 메모리 대역폭 이득이 달라진다.

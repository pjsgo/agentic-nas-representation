changes:
- before_units:
  - factors.project_a
  - factors.partition_a
  - factors.shape_q
  - factors.shape_k
  - factors.shape_v
  after_units:
  - factors.gqa_group
  operation: descriptive_correspondence
  mechanism: 출발 head별 QKV 구성과 대상 query-to-KV-group 대응을 연결한다. 대상은 투영 이후 QKV를 외부에서 받아
    projection weight 축소 자체는 매핑하지 않는다.
  state_and_resource_contract: Q head axis H와 KV head axis G를 구분해야 한다. bias와 packed/unpacked
    weight layout은 target 계약이 정한다.
  mapping_status: partial_projection_out_of_scope
- before_units:
  - factors.score_a
  - factors.apply_mask
  - factors.prob_a
  - factors.mix_a
  after_units:
  - factors.gqa_scores
  - factors.gqa_causal
  - factors.gqa_softmax
  - factors.gqa_output
  operation: descriptive_correspondence
  mechanism: 각 query head h가 floor(h/(H/G)) KV group을 읽어 개별 정규화와 value 집계를 수행한다. 대상은
    head를 합치지 않은 B,H,T,D를 반환한다.
  state_and_resource_contract: prefix P를 반영한 causal visibility. 대상 float64와 출발 float32
    및 mask 계약은 다르다. head merge와 output projection은 대상 범위 밖.
  mapping_status: mapped_scoped
- before_units: []
  after_units:
  - factors.gqa_append
  operation: descriptive_correspondence
  mechanism: 외부 prefix cache에 새 G-head K/V를 순서대로 이어 붙인다. 출발 encoder에는 cache 부품이 없다.
  state_and_resource_contract: 입력 불변, 반환 cache는 fresh storage B,G,P+T,D. 공식 Llama의
    preallocated inplace API와 구분한다.
  mapping_status: target_only_source_out_of_scope
preserve:
- query head별 scaled dot-product softmax와 value 가중합
- query head 수 및 출력 결합의 개념. 토큰 sparse mask, RoPE, RMSNorm은 GQA 정의에 필수인 추가 변경으로 간주하지
  않는다.

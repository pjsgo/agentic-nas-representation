- source_concept: head별 독립 K/V
  target_concept: group별 K/V와 query-to-group 대응
  mapping_status: mapped_scoped
  reason: gqa_group, gqa_scores, gqa_softmax, gqa_output에 연결됨; learned projection은
    제외.
- source_concept: 논문의 autoregressive MHA cache 및 pretrained checkpoint
  target_concept: 축소 KV cache, 그룹 평균 초기화, uptraining
  mapping_status: partial
  reason: 축소 cache는 gqa_append에 target-only로 연결. 출발 cache, checkpoint 평균과 uptraining은
    여전히 범위 밖.

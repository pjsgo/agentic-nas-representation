motivation: attention과 token-wise FFN으로 NLP 계산을 구성하는 아이디어를 연결한다.
conditions:
- DA는 unscaled cross scores/양방향 alignment이고 Transformer는 head 분할 및 scaled dot-product
  self-attention이다. DA sum aggregate 및 classifier와 Transformer token 출력을 동일시하지 않는다.
  DA 원저자 구현 미확인 공백을 유지한다.
- 기대 효과는 설명이며 실측 성능 결과나 실행 변환 인증이 아니다.
expected_effects:
- RNN/CNN 없이 구성되는 attention/FFN 아이디어의 대응을 설명한다.
tradeoffs:
- Transformer의 pairwise attention 비용이 남으며 NLI 모델을 그대로 번역 모델로 바꾸는 규칙은 아니다.

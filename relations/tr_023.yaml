  - factors.activate_a
  - factors.contract_a
  operation: descriptive_correspondence
  mechanism: shared F 기반 cross-sentence attention 및 token-wise G 아이디어를 Transformer
    Q/K/V projection, scaled self-attention 및 token-wise FFN에 대응한다. DA의 원래 token과
    aligned value concat-G와 Transformer FFN의 입력은 다르다.
  mapping_status: mapped_scoped
  cardinality: semantic_many_to_many_not_tensor_parameter_or_state_identity
  state_and_resource_contract: DA는 unscaled cross scores/양방향 alignment이고 Transformer는

motivation: 순환 없이 시퀀스를 다루는 convolution 설계를 연결한다.
conditions:
- 현재 둘 다 supplied internal feature stack이며 raw audio/토큰 모델이 아니다. ByteNet causal=true는
  왼쪽, false는 중앙 padding이다. WaveNet과 causal decoder식 비교는 causal=true에서만 성립한다. 동적 unfolding,
  conditioning, skip head 및 cache 이식은 제외한다.
- 기대 효과는 설명이며 실측 성능 결과나 실행 변환 인증이 아니다.
expected_effects:
- dilation을 이용한 문맥 확장의 아이디어 계승 범위를 설명한다.
tradeoffs:
- 유한 receptive field와 층 구성에 따른 문맥 제약이 남으며 전체 모델 또는 weight 이식을 뜻하지 않는다.
changes:
- before_units:
  - factors.wavenet_dilated_filter
  - factors.wavenet_dilated_gate
  - factors.wavenet_residual
  after_units:
  - factors.bytenet_dilated
  - factors.bytenet_residual
  operation: descriptive_correspondence
  mechanism: WaveNet의 width-2 causal dilated convolution과 residual 문맥 확장 아이디어를 ByteNet
    ReLU bottleneck의 width-3 dilated convolution 및 residual에 대응한다. WaveNet tanh*sigmoid
    gate를 ByteNet ReLU/LN block이 그대로 계승한다고 하지 않는다.
  mapping_status: mapped_scoped
  cardinality: semantic_many_to_many_not_tensor_parameter_or_state_identity
  state_and_resource_contract: 현재 둘 다 supplied internal feature stack이며 raw audio/토큰
    모델이 아니다. ByteNet causal=true는 왼쪽, false는 중앙 padding이다. WaveNet과 causal decoder식
    비교는 causal=true에서만 성립한다. 동적 unfolding, conditioning, skip head 및 cache 이식은 제외한다.

motivation: 제한된 희소 연결에서도 지역 문맥, 전역 전달, 멀리 떨어진 위치 접근을 함께 제공한다.
conditions:
- 선택 core는 bidirectional ITC 형태이며 첫 블록과 마지막 블록이 global이다. ETC의 추가 token 변형과 구분한다.
- N=M*S, M>=8, R>=1이며 caller가 head별 directed random block 목록을 제공한다. 중복과 local/global
  겹침을 허용하지 않는다.
- 첫 내부 블록과 끝에서 두 번째 블록 사이의 random 선택 제한을 포함한 대상 YAML의 legal_row 계약을 따른다.
- 선형 비용 주장은 block 크기, local 범위, global 수와 random 수가 고정되고 sparse 실행을 할 때에 한한다.
expected_effects:
- 지역 연결과 전역 연결에 random 경로를 추가하여 긴 문맥에 접근한다.
- 논문의 표현력 결과는 명시된 가정의 전체 구조에 관한 것이며 이 작은 core의 검증 결과가 아니다.
tradeoffs:
- random graph 자원과 sampling 정책이 필요하다. block 정렬과 sparsity 처리에 구현 비용이 든다.
- dense attention과 일반적으로 출력이 같지 않으며 인과성도 출발 core와 다르다.

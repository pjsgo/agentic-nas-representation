motivation: Memory Network의 support-label 감독과 이산 선택을 완화한다.
conditions:
- 입출력 쌍으로 학습하는 연속 hop을 전제한다. hard support의 argmax 파라미터를 그대로 이식하지 않는다.
expected_effects:
- supporting-fact 정답 없이 end-to-end 미분 경로를 제공한다.
tradeoffs:
- 모든 memory slot을 읽는 비용과 soft selection의 혼합 손실이 남는다. 학습 성공은 이 기록의 검증 대상이 아니다.

motivation: segment memory를 재사용할 때 위치가 혼동되지 않도록 상대 위치 계산을 새로 구성한다.
conditions:
- 선택된 Transformer-XL은 sinusoidal relative attention과 두 global bias를 포함한 postnorm sublayer이다.
- Shaw와 같은 수식 또는 교환 가능한 구현이라는 뜻이 아니다. C 분류는 슬라이드를 보존한다.
expected_effects:
- 상대 거리로 이전 segment의 위치를 구별하면서 문맥을 재사용한다.
tradeoffs:
- relative projection, u/v와 memory 관리가 필요하다. Shaw 테이블을 그대로 옮길 수 없다.
changes:
- before_units:
  - factors.rp_relative_index
  - factors.rp_relative_lookup
  after_units:
  - factors.txl.relative_position
  operation: descriptive_correspondence
  mechanism: clipped learned table을 sinusoidal distance와 선형 투영으로 바꾼다.
  state_and_resource_contract: 출발 j-i와 대상 M+i-j의 부호 및 memory offset이 다르다. 대상 position
    clamp 제외.
  mapping_status: mapped_scoped
- before_units:
  - factors.rp_content_score
  - factors.rp_relative_key_score
  - factors.rp_scale_mask_softmax
  after_units:
  - factors.txl.relative_score
  - factors.txl.causal_attention
  operation: descriptive_correspondence
  mechanism: 대상은 (Q+u)K와 (Q+v)R의 합을 scale하고 causal mask를 적용한다.
  state_and_resource_contract: 대상의 relative projection 및 u/v는 학습 파라미터이다. 공식 relative
    shift와 YAML 거리 표현은 배치 방식이 다르다.
  mapping_status: mapped_scoped
- before_units:
  - factors.rp_relative_value_aggregate
  after_units:
  - factors.txl.causal_attention
  operation: descriptive_correspondence
  mechanism: Shaw 상대 value 가중합을 대상의 content V 집계에 대응한다.
  state_and_resource_contract: 대상에는 Shaw 상대 value 테이블 항이 없다. 삭제 가능한 동일 파라미터로 취급하지
    않는다.
  mapping_status: mapped_scoped
- before_units: []
  after_units:
  - factors.txl.memory_read
  - factors.txl.memory_update
  operation: descriptive_correspondence
  mechanism: 이전 segment 입력 상태를 읽고 길이 제한을 두어 detach한 다음 상태를 반환한다.
  state_and_resource_contract: 출발은 무상태. 대상 memory는 [M,B,D], 읽기 후 갱신이며 ext_len=0.
  mapping_status: target_only_source_out_of_scope
preserve:
- 상대 위치로 attention을 조건화하는 개념
- scaled score, key softmax와 value 집계 원리. 수치 함수 동일성은 보존 주장이 아니다.
conceptual_correspondence:
- source_concept: projected QKV core
  target_concept: projection, output projection, residual, postnorm을 갖는 segment sublayer
  mapping_status: partial
  reason: 출발에는 해당 전체 sublayer 부품이 없으며 관계를 위해 추가하지 않는다.
unresolved:
- 대상의 recurrence는 Shaw에서 상속된 상태가 아니다.
- 전체 모델 및 학습 절차는 매핑 범위 밖이다.

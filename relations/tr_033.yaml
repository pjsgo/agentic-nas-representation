  mechanism: 전체 pair 대신 angular hash, bucket-position 정렬, 이전 및 현재 chunk 연결과 shared
    QK score를 구성한다.
  state_and_resource_contract: 대상 key만 RMS형 길이 정규화 후 sqrt(D) scale. supplied rotations,
    hash tie 규칙과 finite penalty는 대상 계약을 따른다.

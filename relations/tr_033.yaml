motivation: 긴 sequence의 attention 비용과 깊은 모델의 activation 메모리 병목을 줄인다.
conditions:
- 현재 core는 이미 투영된 shared QK와 V, 외부 제공 rotations를 받는다.
- 현재 Trax profile은 global circular adjacent chunks, finite self/causal penalties,
  occurrence multiplicity를 보존한다. 엄격한 bucket mask와 Appendix A 중복 보정은 포함하지 않는다.
expected_effects:
- hash 정렬과 제한된 chunk attention으로 전체 pair 연산을 줄일 수 있다. 복잡도는 hash round와 chunk 설정에 의존한다.
tradeoffs:
- hash 근사로 dense attention과 다른 출력을 내며 정렬과 여러 round 비용이 추가된다.
- 작은 core의 설명만으로 전체 Reformer 메모리 절감을 인증할 수 없다.

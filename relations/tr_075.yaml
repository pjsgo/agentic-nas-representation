motivation: H3의 gate와 convolution 결합을 더 일반적인 operator로 확장한다.
conditions:
- H3에서 Hyena로의 I 관계이다. 논문의 SISO 재표현과 local scalar-head H3, 도착 Hyena order를 구분한다.
expected_effects:
- attention 행렬을 만들지 않는 data-dependent sequence mixer를 구성한다.
tradeoffs:
- order와 filter network에 따른 계산 비용이 남고 H3의 state와 Hyena filter는 직접 호환되지 않는다.

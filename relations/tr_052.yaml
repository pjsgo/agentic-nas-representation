motivation: attention 이외의 causal convolution과 gating 설계를 연결한다.
conditions:
- I?를 보존한다. 선택 WaveNet과 Hyena 모두 cache 없는 supplied-feature core다. WaveNet residual/skip
  출력과 Hyena diagonal skip/output projection을 같은 부품으로 연결하지 않는다. Hyena는 고정 l_max이고 full
  LM·streaming 및 weight/state migration은 제외한다.
- 기대 효과는 설명이며 실측 성능 결과나 실행 변환 인증이 아니다.
expected_effects:
- 짧은 dilated filter와 implicit long filter의 설계 차이를 설명한다.
tradeoffs:
- 선택 Hyena에는 streaming cache가 없고 고정 l_max가 있다. WaveNet 상태·cache를 Hyena로 이식할 수 있다고
  주장하지 않는다.

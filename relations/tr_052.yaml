  - graph.hyena_modulation
  - graph.hyena_gated_long_convolution
  operation: descriptive_correspondence
  mechanism: WaveNet의 짧은 dilated filter와 tanh*sigmoid gate를 Hyena의 short filter, 위치
    MLP implicit long filter, modulation 및 multiplicative long-convolution recurrence에
    개념 대응한다. Hyena의 곱셈 gate에는 WaveNet의 tanh/sigmoid가 없다.
  mapping_status: mapped_scoped
  cardinality: semantic_many_to_many_not_tensor_parameter_or_state_identity
  state_and_resource_contract: I?를 보존한다. 선택 WaveNet과 Hyena 모두 cache 없는 supplied-feature

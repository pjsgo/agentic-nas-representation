format_version: local_transition_v1
transition_id: tr_062
source_architecture: H3
target_architecture: Mamba
relation_type: A
inferred: false
motivation: Make memory dynamics depend on token content while simplifying the gated SSM plus MLP architecture.
conditions:
- Architecture ancestry and selective-state change are distinct; external gating alone is not selective dynamics.
- This relationship preserves the separate direct S4-to-Mamba tr_061 edge.
- Peer B scope begins after convolution and ends before output gate, so it cannot realize the full A·062 block mapping.
expected_effects:
- Content-dependent retention and readout through delta/B/C.
- A combined gated sequence/MLP block with expansion and SiLU.
tradeoffs:
- Input-dependent parameters prevent a single fixed convolution kernel; efficient implementation requires selective
  scan.
- State representation and parameter meanings change; H3 weights and states are not directly transferable.
- Full gate/projection/convolution changes exceed the peer selective-core implementation.

  mechanism: Static complex bilinear H3 S4D becomes real A=-exp(A_log), delta/B/C generated from input, exp(delta*A)
    retention and practical delta*B input update.
  wiring: Peer input is post-convolution activated u, not H3 kv; no equality assertion.
  state: '[B,2,2] complex H3 carry versus peer [B,1,2] real carry; no state migration defined.'

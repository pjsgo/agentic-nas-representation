motivation: 선형 attention의 누적 memory 아이디어를 감쇠 retention과 연결한다.
conditions:
- 원본 I?를 유지한다. 선택 raw retention에 TorchScale의 mode별 stabilization까지 있다고 가정하지 않는다.
- 출발 core는 기존 in-place S/Z 계약이고 대상은 명시적 비변이 반환 상태이다. 상태 aliasing까지 보존하는 변환이 아니다.
expected_effects:
- 병렬식과 순환식으로 선택 retention core를 표현한다.
tradeoffs:
- 부호 있는 score와 decay로 normalization 의미가 바뀌며 동일 출력이나 무손실 압축은 보장되지 않는다.

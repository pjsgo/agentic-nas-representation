motivation: 순환 번역 decoder 밖에서 soft alignment 아이디어를 사용한다.
conditions:
- supplied Bahdanau annotations/conditional GRU와 supplied embedded sentence-pair의
  경계가 다르다. 두 방향 mask 축과 valid-token 정규화를 구별한다. classifier와 전체 NLI, 원저자 runtime parity는
  제외한다.
- 기대 효과는 설명이며 실측 성능 결과나 실행 변환 인증이 아니다.
expected_effects:
- attention 아이디어와 순환 상태 계약을 분리해 설명한다.
tradeoffs:
- 기본 분해형 attention의 어순 표현과 sequence generation 범위는 제한된다.
changes:
- before_units:
  - additive_attention/energy
  - additive_attention/weights
  - additive_attention/context
  after_units:
  - factors.da_shared_F
  - factors.da_scores
  - factors.da_align
  operation: descriptive_correspondence
  mechanism: decoder 이전 hidden에 조건화된 additive energy/softmax/context 아이디어를 shared
    F로 변환한 두 문장의 dot score 및 양방향 alignment에 대응한다. decoder recurrence는 대상에 없으며 score는
    unscaled inner product다.
  mapping_status: mapped_scoped
  cardinality: semantic_many_to_many_not_tensor_parameter_or_state_identity
  state_and_resource_contract: supplied Bahdanau annotations/conditional GRU와 supplied

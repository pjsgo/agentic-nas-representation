motivation: 다항식 memory 연산자를 학습 가능한 시간 척도를 가진 sequence layer로 사용한다.
conditions:
- 현재 HiPPO는 1/k 시간 가변 bilinear이고 LSSL은 head별 exp(log_dt) 고정 시간 척도이다. 같은 A/B가 같은 궤적을
  뜻하지 않는다.
expected_effects:
- 재귀와 convolution 관점으로 사용할 수 있는 memory layer를 구성한다.
tradeoffs:
- 유한 차수 압축 오차와 이산화 의존이 남는다. 현 LSSL 복원은 논문의 structured trainable A 전체를 포함하지 않는다.

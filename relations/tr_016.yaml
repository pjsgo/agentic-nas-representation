motivation: 순환 병목에 대응하는 convolution 기반 두 대안을 비교한다.
conditions:
- X?를 유지한다. ByteNet은 encoder-decoder 연결과 dynamic unfolding을 포함하지 않는 feature stack이고
  ConvS2S는 preembedded 한 block pair다. ConvS2S attention의 별도 기여 tr_017을 ByteNet에서 직접
  계승한 부품으로 묶지 않는다.
- 기대 효과는 설명이며 실측 성능 결과나 실행 변환 인증이 아니다.
expected_effects:
- 같은 병목에 대한 서로 다른 convolution 설계를 구별한다.
tradeoffs:
- receptive field 및 decoder 생성 순차성 제약이 남고 속도 우위는 실측하지 않았다.

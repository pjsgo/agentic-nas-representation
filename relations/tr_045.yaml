motivation: 학습 attention을 비학습 Fourier 혼합으로 대체하여 token 혼합 비용을 낮춘다.
conditions:
- sequence와 hidden 두 축의 복소 DFT를 모두 수행한 뒤 실수부를 취한다. 중간 실수부 절단과 다르다.
- FourierTransform은 padding_mask를 무시한다. causal attention의 직접 대체로 해석하지 않는다.
- eval float64/complex128 단일 block, N<=4096이며 batch 축은 변환하지 않는다.
- 공식 기본 dtype의 반올림 동등성, 초기화와 dropout 학습은 제외한다.
expected_effects:
- Fourier mixer의 학습 QKV 파라미터와 attention 행렬을 제거하며 FFT 구현으로 혼합 비용을 낮출 수 있다.
tradeoffs:
- 내용 의존 attention과 mask 제어를 잃는다. 속도는 FFT/DFT 구현과 장치에 의존한다.
changes:
- before_units:
  - factors.stage_a
  - factors.score_a
  - factors.prob_a
  - factors.mix_a
  after_units:
  - factors.fnet_fourier_mixer
  operation: descriptive_correspondence
  mechanism: QKV attention을 두 축 비정규화 forward DFT 후 최종 실수부 추출로 교체한다.
  state_and_resource_contract: 학습 mixer 파라미터 없음. padded embedding도 혼합되며 N 변화는 Fourier
    basis를 바꾼다.
  mapping_status: mapped_scoped
- before_units:
  - factors.merge_a
  - factors.normalize_a
  after_units:
  - factors.fnet_mixing_residual_norm
  operation: descriptive_correspondence
  mechanism: 입력과 mixer 출력을 더한 뒤 affine LN을 적용하는 post-norm 골격을 유지한다.
  state_and_resource_contract: eps=1e-5에서 1e-12로 변경. 대상은 max(0,E[z^2]-E[z]^2) variance와
    float64 계산.
  mapping_status: mapped_scoped
- before_units:
  - factors.stage_b
  - factors.expand_a
  - factors.activate_a
  - factors.contract_a
  after_units:
  - factors.fnet_ffn
  operation: descriptive_correspondence
  mechanism: biased two-dense FFN 구조는 유지하고 ReLU를 tanh 근사 GELU로 바꾼다.
  state_and_resource_contract: target [in,out]과 source [out,in] weight 방향이 다르다. 가중치
    변환은 제공하지 않는다.
  mapping_status: mapped_scoped
- before_units:
  - factors.merge_b
  - factors.normalize_b
  after_units:
  - factors.fnet_output_residual_norm
  operation: descriptive_correspondence
  mechanism: FFN 잔차 합 뒤 두 번째 affine LN을 유지한다.
  state_and_resource_contract: 두 norm 파라미터는 공유하지 않는다. 출력 동등성은 주장하지 않는다.
  mapping_status: mapped_scoped

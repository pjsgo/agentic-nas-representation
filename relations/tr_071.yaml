- 원본 I 관계이다. Transformer 논문의 관련연구 인용을 확인하며 LSTM gate 직접 계승으로 해석하지 않는다.
expected_effects:
- token별 recurrent 의존 없이 context를 집계한다.
tradeoffs:
- cell tape와 LSTM gate는 없어지고 위치 표현 및 dense attention 비용이 필요하다.

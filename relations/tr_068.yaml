motivation: 성장하는 KV cache 대신 context를 학습기 state로 압축하는 대안을 비교한다.
conditions:
- 원본 X 관계이며 일반 Transformer attention과 모든 TTT variant가 동등하다는 주장이 아니다.
- 실제 대상은 single-head TTT-Linear이고 T%chunk_size=0인 완전 chunk만 허용한다. chunk 시작 W/b에서 gradient를
  계산하며 prefix별 갱신 뒤 query를 읽는다.
- TTT의 inner update는 설명 대상 계산이다. 이 관계 세션에서는 그 수치 계산이나 학습을 실행하지 않았다.
expected_effects:
- 고정된 learner 차원에서 context 길이에 독립적인 state 크기를 갖는다.
tradeoffs:
- 압축 손실, inner update 비용과 병렬 mini-batch 구현 제약이 남는다.

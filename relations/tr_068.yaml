    query 기반 learner readout으로 바꾼다.
  mapping_status: mapped_scoped
  state_and_resource_contract: 단일 eval encoder block. 전체 encoder-decoder, token embedding과
    autoregressive decoding cache가 없다. single-head TTT-Linear residual LN learner와
    learned views, whole-chunk gradients 및 causal prefix update. TTT-MLP, full wrapper,
    RoPE, outer training과 partial-chunk cache는 없다.
  cardinality: many_to_many_semantic_correspondence_not_tensor_or_parameter_identity

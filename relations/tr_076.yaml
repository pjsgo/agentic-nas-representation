motivation: Transformer attention을 장거리 convolution 기반 mixer로 대체한다.
conditions:
- 원본 A 관계를 유지한다. 복원 대상 Hyena operator가 FFN, residual, norm을 포함하는지 별도로 제한한다.
expected_effects:
- 고정 order에서 FFT 기반 긴 convolution을 사용할 수 있는 구조이다.
tradeoffs:
- FFT 구현과 실제 속도는 여기서 검증하지 않으며 attention과 동일 출력 또는 같은 cache 계약을 보장하지 않는다.

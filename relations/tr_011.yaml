motivation: 외부 memory의 soft addressing을 문장 내부의 순차 상태에 적용한다.
conditions:
- 아이디어 계승이며 E2E의 embedding tying이나 hop 수를 LSTMN에 강제하지 않는다.
expected_effects:
- 과거 token을 query로 조회하며 읽기와 문맥 상태 갱신을 결합한다.
tradeoffs:
- LSTMN에는 recurrent gate와 tape 상태가 추가되고 E2E와 입력 및 상태 계약이 다르다.
changes:
- before_units:
  - factors.memn2n_address
  - factors.memn2n_read
  - factors.memn2n_update
  after_units:
  - factors.lstmn_address
  - factors.lstmn_read
  - factors.lstmn_gates
  - factors.lstmn_update
  operation: descriptive_correspondence
  mechanism: 정적 fact bank의 여러 hop을 token마다 증가하는 hidden/cell tape의 attention 읽기로 바꾼다.
  mapping_status: mapped_scoped
  state_and_resource_contract: BoW adjacent tying, additive query update, K hops.
    PE/TE, padding, learned H, 학습은 없다. 단층 단일 문장, bias 없는 paper equations, hidden/cell
    tape와 previous weighted read. empty-tape zero read는 로컬 규약이며 공식 코드 parity는 확인 불가.
  cardinality: many_to_many_semantic_correspondence_not_tensor_or_parameter_identity
preserve:
- 미분 가능한 score, softmax, 가중 memory read

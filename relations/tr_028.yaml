motivation: 입력에 더하는 절대 위치 대신 attention에서 두 위치의 방향과 거리를 직접 다룬다.
conditions:
- Shaw et al. 2018의 key 및 value 상대항을 모두 포함하는 self-attention 범위이다.
- 같은 길이 QKV, 양의 radius, head와 batch가 공유하는 두 독립 테이블, 행마다 허용 key가 필요하다.
expected_effects:
- 거리 정보를 score와 출력 집계에 반영한다. 번역 품질 개선은 논문 보고이며 여기서 측정하지 않았다.
tradeoffs:
- 학습 테이블과 상대항 계산이 추가되고 clipping 밖의 거리는 구별하지 못한다.
- 원래 attention과 출력 동등성이나 가중치 직접 호환을 보장하지 않는다.
changes:
- before_units:
  - factors.score_a
  after_units:
  - factors.rp_content_score
  - factors.rp_relative_key_score
  operation: descriptive_correspondence
  mechanism: content score에 query와 상대 key의 내적을 추가한다.
  state_and_resource_contract: 대상 q는 미리 scale하지 않은 float64[B,H,N,D]. 출발 encoder float32
    인터페이스와 다르다.
  mapping_status: mapped_scoped
- before_units: []
  after_units:
  - factors.rp_relative_index
  - factors.rp_relative_lookup
  operation: descriptive_correspondence
  mechanism: j-i를 부호 있게 clip하여 독립 key/value 테이블을 조회한다.
  state_and_resource_contract: caller 소유 두 [2*radius+1,D] 테이블. 내부 등록 파라미터와 지속 상태 없음.
  mapping_status: target_only_source_out_of_scope
- before_units:
  - factors.scale_q
  - factors.apply_mask
  - factors.prob_a
  after_units:
  - factors.rp_scale_mask_softmax
  operation: descriptive_correspondence
  mechanism: content와 상대 key 항을 함께 한 번 scale하고 key축 softmax를 수행한다.
  state_and_resource_contract: 출발 mask는 제외 표시, 대상 allowed=True는 허용 표시. 빈 허용 행은 범위
    밖.
  mapping_status: mapped_scoped
- before_units:
  - factors.mix_a
  after_units:
  - factors.rp_relative_value_aggregate
  operation: descriptive_correspondence
  mechanism: value 가중합에 상대 value를 포함한다.
  state_and_resource_contract: 같은 확률로 content value와 상대 value를 집계한다.
  mapping_status: mapped_scoped
preserve:
- content QK 내적, key축 정규화, head별 value 집계라는 골격
- projection, residual, normalization, FFN의 보존은 전체 구조의 개념 대응이며 대상 core에는 없다.

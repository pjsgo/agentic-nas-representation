motivation: RNN recurrence를 제거하는 두 token mixer를 비교한다.
conditions:
- 전체 encoder-decoder를 하나의 Transformer encoder block으로 치환하는 규칙이 아니다. finite receptive
  field와 dense pairwise 비용을 비교하며 학습 성능·속도는 검증하지 않는다.
- 기대 효과는 설명이며 실측 성능 결과나 실행 변환 인증이 아니다.
expected_effects:
- local receptive field와 전역 pairwise 상호작용의 차이를 설명한다.
tradeoffs:
- convolution은 먼 위치 연결에 층이 필요하고 dense attention은 길이 제곱 비용이 든다. 실제 속도 비교는 하지 않았다.

  - factors.prob_a
  - factors.mix_a
  operation: descriptive_comparison
  mechanism: ConvS2S의 local GLU convolution token mixing을 Transformer pairwise scaled
    self-attention의 대안으로 비교한다. encoder noncausal 문맥과 causal decoder 문맥을 비교 조건에 따라
    구별한다.
  mapping_status: mapped_scoped

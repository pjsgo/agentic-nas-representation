motivation: attention의 검색 능력과 Mamba의 자원 효율을 혼합한다.
conditions:
- 도착은 8층 중 1 attention, 7 Mamba의 축소 주기이며 전체 32층 모델이 아니다. 출발 post-norm과 도착 pre-RMSNorm이
  다르다.
expected_effects:
- attention 층 수를 줄여 긴 문맥의 KV 저장 요구를 줄이는 설계를 제공한다.
tradeoffs:
- attention 비율, expert 수와 활성 expert 수에 따라 품질과 메모리 비용이 달라진다.

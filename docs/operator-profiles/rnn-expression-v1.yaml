profile: r1_expression_graph_v1
status: local_explicit_extension_not_historical_common_schema
interpretation:
  function: Positional args bind names. Nodes are ordered single-assignment expression
    bindings; return expression defines outputs.
  dependencies: Expression identifiers are explicit input edges; function calls are
    explicit region calls.
  component_locator: Stable ID function_name/node_id resolves to functions[function_name].nodes
    entry with matching id.
  parameters: Mapping keys are unique registered ParameterDict resources with exact
    listed shapes. Same key always shares storage across calls/time; different keys
    do not alias.
  expressions: Trusted repository-owned Python expression syntax; scalar/tensor arithmetic,
    indexing, tuples/dicts, lambda and listed primitives only. No architecture-name
    dispatch.
  state: Carries are immutable tuples or tensors; scan step returns (emission,next_carry).
    No hidden persistent model state.
  initialization: Fixture-supplied parameter values; constructor zero values are placeholders,
    not source initialization.
  bounds: CPU float64, finite values, positive nonempty sequence lengths, H=5, no
    training claim.
primitives:
  linear: x @ weight.T + optional bias; apply to last axis with leading axes preserved.
  tanh: Elementwise hyperbolic tangent.
  sigmoid: Elementwise 1/(1+exp(-x)).
  cat: Concatenate tuple of tensors on last feature axis.
  zeros: zeros(reference,features) returns [reference.shape[0],features] with reference
    dtype/device.
  scan: Axis 1. Invoke step(x[:,t],carry) in traversal order; stack emissions on axis
    1. Reverse scan visits T-1..0 and reverses emission list back to original source
    order; final carry is traversal-final, not last chronological emission. Empty
    input raises ValueError.
  masked_softmax: Softmax along last/source axis after false mask positions become
    -infinity. Every batch row must contain a valid source or raise ValueError.
  lstm:
    signature: lstm(x,(h,c),wi,wh,bi,bh) -> (h_next,c_next)
    shapes: x=[B,I], h/c=[B,5], wi=[20,I], wh=[20,5], bi/bh=[20]
    packed_order:
    - input
    - forget
    - proposal
    - output
    equations:
      gates: linear(x,wi,bi)+linear(h,wh,bh)
      c_next: sigmoid(forget)*c+sigmoid(input)*tanh(proposal)
      h_next: sigmoid(output)*tanh(c_next)
    reuse: ../../architectures/lstm/reconstructed.py
    function: RecurrentTensorRegion.forward with T=1
    research_evidence:
      path: parallel_coverage/20261105/lstm/evaluations/t_ge_1_v1/report.md
      availability: research workspace only; not a repository-relative file
  tensor_methods: sum(dim), squeeze(-1), and indexing use PyTorch semantics; Python
    arithmetic broadcasts with PyTorch rules.
source_parameter_adapters:
  tensorflow_basic_lstm:
    source: https://github.com/tensorflow/tensorflow/blob/v1.12.0/tensorflow/python/ops/rnn_cell_impl.py
    function: BasicLSTMCell.call
    original_gate_order:
    - input
    - proposal
    - forget
    - output
    local_gate_order:
    - input
    - forget
    - proposal
    - output
    mapping: Split original kernel input and recurrent rows, transpose, permute block
      indices [0,2,1,3]; permute bias identically and add forget_bias=1 to forget
      block. Local bi+bh equals this effective bias.
    state_mapping: TensorFlow (c,h) -> local (h,c)
    parameterization: Two local biases have one effective sum; source's single bias
      has equivalent forward capacity. No claim of identical parameter registration
      or training dynamics.

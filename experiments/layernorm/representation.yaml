representation_version: local_genealogy_core_v1
operator_profile: explicit_pytorch_tensor_equations_v1
architecture: LayerNorm
architecture_entry: ln.component
realization: generated_model.py:build
scope:
  included:
  - trailing_axis_population_statistics
  - epsilon_inside_sqrt
  - elementwise_affine
  excluded:
  - whole_model
  - optimizer
  - original_class_identity
  - mixed_precision
interface:
  input:
    x: CPU float64 [*, normalized_shape]
  output:
    y: same_shape_as_x
config:
  normalized_shape:
  - 4
  eps: 1.0e-05
parameters:
  gamma:
    shape: normalized_shape
    initialization: externally_supplied
    identity: retained
  beta:
    shape: normalized_shape
    initialization: externally_supplied
    identity: retained
state:
  recurrent: none
  running_statistics: none
factors:
  ln.component:
    contains:
    - ln.mean
    - ln.center
    - ln.variance
    - ln.normalize
    - ln.affine
  ln.mean:
    operator: mean
    attributes:
      axes: trailing_normalized_axes
      keepdim: true
  ln.center:
    operator: sub
    inputs:
    - x
    - ln.mean
  ln.variance:
    operator: mean_square
    inputs:
    - ln.center
    attributes:
      axes: trailing_normalized_axes
      correction: 0
      keepdim: true
  ln.normalize:
    operator: multiply_rsqrt
    inputs:
    - ln.center
    - ln.variance
    attributes:
      epsilon_added_to_variance: config.eps
  ln.affine:
    operator: mul_then_add
    inputs:
    - ln.normalize
    - gamma
    - beta
dataflow:
- - x
  - ln.mean.input
- - ln.mean.output
  - ln.center.mean
- - ln.center.output
  - ln.variance.input
- - ln.center.output
  - ln.normalize.center
- - ln.variance.output
  - ln.normalize.variance
- - ln.normalize.output
  - ln.affine.input
- - ln.affine.output
  - y
semantics:
  trailing_normalized_axes: last_len_normalized_shape_axes
  mean_square: mean_of_elementwise_square
  multiply_rsqrt: center_times_reciprocal_sqrt_of_variance_plus_epsilon
  mul_then_add: normalized_times_gamma_plus_beta
  mutation: no_input_or_parameter_mutation
  mode: identical_train_eval
reuse:
  existing_transformer_parts:
  - normalize_a
  - normalize_b
  source_yaml: ../transformer/20261113-core-completion/representation.yaml
  policy: read_only_semantic_reuse_no_existing_model_execution

scope:
  included: fixed HiPPO-LegS A/B shared across channels, independently learned log_dt/C/D, bilinear dynamics, dense
    recurrence, Krylov output kernel
  excluded: trainable structured A/B, post-core activation/mixing/dropout, full network, training, upstream cache
    behavior, FFT performance
  state_adapter: Paper x_prev contract; source Platypus cache state is preadvanced, so its cache layout is not claimed
    equivalent.
  reference_independence: NumPy similarity transform and explicit matrix powers/convolution; candidate uses Torch
    direct LegS entries and recurrent update. No shared calculation helpers.

representation_version: 0.4-candidate.1
operator_profile: tensor_pytorch_2_2_1_v0_3_r1
architecture: unit_a
architecture_entry: unit
description: Causal ELU+1 attention edit; inference external S/Z; local operator semantics
  in transition and realization.py; no Common Schema certification.
factors:
  unit:
    contains:
    - stage_a
    - merge_a
    - normalize_a
    - stage_b
    - merge_b
    - normalize_b
  stage_a:
    contains:
    - project_a
    - partition_a
    - shape_q
    - shape_k
    - shape_v
    - order_q
    - order_k
    - order_v
    - linear_causal_core
    - order_mix
    - join_a
    - project_b
  project_a:
    operator: linear
    attributes:
      bias: true
  partition_a:
    operator: split
    attributes:
      sections:
      - 8
      - 8
      - 8
      dim: 2
  shape_q:
    operator: reshape
    attributes:
      shape:
      - B
      - T
      - 2
      - 4
  order_q:
    operator: permute
    attributes:
      dims:
      - 0
      - 2
      - 1
      - 3
  shape_k:
    operator: reshape
    attributes:
      shape:
      - B
      - T
      - 2
      - 4
  order_k:
    operator: permute
    attributes:
      dims:
      - 0
      - 2
      - 1
      - 3
  shape_v:
    operator: reshape
    attributes:
      shape:
      - B
      - T
      - 2
      - 4
  order_v:
    operator: permute
    attributes:
      dims:
      - 0
      - 2
      - 1
      - 3
  order_mix:
    operator: permute
    attributes:
      dims:
      - 0
      - 2
      - 1
      - 3
  join_a:
    operator: reshape
    attributes:
      shape:
      - B
      - T
      - 8
  project_b:
    operator: linear
    attributes:
      bias: true
  stage_b:
    contains:
    - expand_a
    - activate_a
    - contract_a
  expand_a:
    operator: linear
    attributes:
      bias: true
  activate_a:
    operator: relu_functional
  contract_a:
    operator: linear
    attributes:
      bias: true
  merge_a:
    operator: add
    attributes:
      inplace: false
  normalize_a:
    operator: layer_norm
    attributes:
      normalized_shape:
      - 8
      eps: 1.0e-05
      affine: true
  merge_b:
    operator: add
    attributes:
      inplace: false
  normalize_b:
    operator: layer_norm
    attributes:
      normalized_shape:
      - 8
      eps: 1.0e-05
      affine: true
  linear_causal_core:
    operator: local_causal_elu_scan
    attributes:
      eps: 1.0e-06
      feature_map: elu_plus_one
      time_axis: 2
      update_before_read: true
dataflow:
- - parameters.p0

representation_version: local_genealogy_core_v1
operator_profile: explicit_pytorch_tensor_equations_v1
architecture: Compressive Transformer
architecture_entry: ct.memory_attention
realization: repaired_model.py:build
scope:
  included:
  - mean_pooling_baseline
  - fixed_capacity_dual_fifo
  - joint_causal_attention
  - separate_relative_position_banks
  - segment_state_update
  excluded:
  - learned_conv_compression
  - dilated_conv
  - max_pooling
  - most_used_compression
  - auxiliary_attention_reconstruction_loss
  - auxiliary_autoencoding_loss
  - full_training
  - residual_norm_ffn_tower
  - input_embedding_mlp
  - single_token_sampling_schedule
  - dropout
config:
  d_model: 8
  heads: 2
  d_head: 4
  episodic_capacity: 4
  compressed_capacity: 2
  compression_rate: 2
interface:
  inputs:
    x: float64 [B,T,D]
    episodic: float64 [B,M,D]
    compressed: float64 [B,C,D]
    index: integer_segment_count
  outputs:
    y: '[B,T,D]'
    episodic: '[B,M,D]'
    compressed: '[B,C,D]'
    index: previous_plus_one
    pooled: '[B,T/rate,D]'
    scores: '[B,H,T,C+M+T]'
    auxiliary_loss: zero_scalar
  constraints:
  - T>=2
  - T%rate=0
  - rate>=2
  - T<=M
  - M>0
  - C>0
  - D=H*d_head
  - D even
parameters:
  query:
    shape: '[D,H*d_head]'
    bias: false
  key:
    shape: '[D,H*d_head]'
    bias: false
  value:
    shape: '[D,H*d_head]'
    bias: false
  out:
    shape: '[H*d_head,D]'
  out_bias:
    shape: '[D]'
  relative_compressed:
    shape: '[D,H*d_head]'
    sharing: distinct_from_episodic
  relative_episodic:
    shape: '[D,H*d_head]'
  u:
    shape: '[H,d_head]'
    role: shared_content_bias
  v_compressed:
    shape: '[H,d_head]'
    sharing: distinct_from_episodic
  v_episodic:
    shape: '[H,d_head]'
  compression_parameters: none_mean_pooling
state:
  episodic:
    initialization: zeros
    order: oldest_first
    update: ct.episodic_update
    inplace: false
  compressed:
    initialization: zeros
    order: oldest_first
    update: ct.compressed_update
    inplace: false
  index:
    initialization: 0
    update: increment_one_per_segment
  gradients: preserved_through_state_as_in_Sonnet_no_implicit_detach
factors:
  ct.memory_attention:
    contains:
    - ct.memory_read
    - ct.project
    - ct.relative_compressed
    - ct.relative_episodic
    - ct.joint_attention
    - ct.output
    - ct.evict
    - ct.compress_mean
    - ct.episodic_update
    - ct.compressed_update
  ct.memory_read:
    operator: cat
    inputs:
    - compressed
    - episodic
    - x
    attributes:
      axis: 1
      order: oldest_bank_to_current
  ct.project:
    operator: linear_heads
    inputs:
    - x
    - ct.memory_read
    - query
    - key
    - value
    attributes:
      Q: x
      KV: ct.memory_read
      query_scale_before_bias: 1/sqrt(d_head)
  ct.relative_compressed:
    operator: sinusoid_linear_relative_score
    inputs:
    - ct.project.Q
    - relative_compressed
    - v_compressed
    attributes:
      distance: C+i-j, j=0..C-1
      sinusoid: concat(sin(distance*10000**(-2*k/D)),cos(distance*10000**(-2*k/D)))
      k: 0..D/2-1
      compression_rate_not_multiplied_into_distance: true
  ct.relative_episodic:
    operator: sinusoid_linear_relative_score
    inputs:
    - ct.project.Q
    - relative_episodic
    - v_episodic
    attributes:
      distance: M+i-j, j=0..M+T-1
      sinusoid: same_as_compressed_bank
  ct.joint_attention:
    operator: joint_softmax_weighted_sum
    inputs:
    - ct.project.Q
    - ct.project.K
    - ct.project.V
    - u
    - ct.relative_compressed
    - ct.relative_episodic
    equation: softmax_key((Q_scaled+u) dot K + concat((Q_scaled+v_compressed) dot R_compressed,(Q_scaled+v_episodic)
      dot R_episodic) + causal_mask) @ V
    attributes:
      mask: all memory allowed; current j>i blocked
      normalization: single_softmax_across_both_banks_and_current
      mask_value: -inf
  ct.output:
    operator: merge_heads_linear_bias
    inputs:
    - ct.joint_attention
    - out
    - out_bias
  ct.evict:
    operator: slice
    inputs:
    - episodic
    attributes:
      axis: 1
      start: 0
      length: T
  ct.compress_mean:
    operator: avg_pool1d
    inputs:
    - ct.evict
    attributes:
      axis: time
      kernel: config.compression_rate
      stride: config.compression_rate
      padding: valid
      extra_kernel: 0
      auxiliary_loss: 0
  ct.episodic_update:
    operator: concat_tail
    inputs:
    - episodic
    - x
    attributes:
      axis: 1
      keep: config.episodic_capacity
  ct.compressed_update:
    operator: concat_tail
    inputs:
    - compressed
    - ct.compress_mean
    attributes:
      axis: 1
      keep: config.compressed_capacity
dataflow:
- - compressed
  - ct.memory_read.compressed
- - episodic
  - ct.memory_read.episodic
- - x
  - ct.memory_read.current
- - ct.memory_read.output
  - ct.project.KV
- - x
  - ct.project.Q
- - ct.project.Q
  - ct.relative_compressed.Q
- - ct.project.Q
  - ct.relative_episodic.Q
- - ct.relative_compressed.output
  - ct.joint_attention.compressed_position
- - ct.relative_episodic.output
  - ct.joint_attention.episodic_position
- - ct.project.QKV
  - ct.joint_attention.QKV
- - ct.joint_attention.output
  - ct.output.input
- - ct.output.output
  - y
- - episodic
  - ct.evict.input
- - ct.evict.output
  - ct.compress_mean.input
- - ct.compress_mean.output
  - ct.compressed_update.new
- - ct.compressed_update.output
  - next.compressed
- - ct.episodic_update.output
  - next.episodic
semantics:
  equations: declarative_mathematics_not_eval_strings
  execution: named_factors_manually_realized_in_candidate_with_config_read_from_yaml
  identity: externally_supplied_parameter_objects_reused_across_segments
  read_before_write: current_output_reads_old_banks_only_new_pooled_values_visible_next_segment
  fidelity: official_Sonnet_pooling_core_translated_to_PyTorch_float64
  mask_adaptation: negative_infinity_instead_of_source_negative_1e6_finite_fixture_outputs_equivalent
  tensor_layout: B_T_D_matches_Sonnet
  position_rule: Sonnet_separate_slot_based_relative_tables_not_invented_token_distance_scaling

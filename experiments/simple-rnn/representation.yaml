representation_version: r1_expression_graph_v1
operator_profile: ../../docs/operator-profiles/rnn.yaml
architecture: simple_rnn
architecture_entry: main
scope: Elman tanh recurrent core, full emitted sequence and supplied initial/final hidden state
excluded:
- training/gradients
- tokenization/embedding lookup
- beam search
- full translation system
- original initializer fidelity
interface:
  inputs:
    x: '[B,T,3]'
    h0: '[B,5]'
  dtype: float64
  layout: batch,time,feature
  constraints: B,S,T>=1; H=5; CPU; eval; no in-place mutation
  outputs:
    output: '[B,T,5]'
    final_h: '[B,5]'
parameters:
  Wi:
  - 5
  - 3
  Wh:
  - 5
  - 5
  bi:
  - 5
  bh:
  - 5
functions:
  cell:
    args:
    - x
    - h
    nodes:
    - id: input_affine
      expr: linear(x,p['Wi'],p['bi'])
    - id: recurrent_affine
      expr: linear(h,p['Wh'],p['bh'])
    - id: hidden
      expr: tanh(input_affine+recurrent_affine)
    return: (hidden,hidden)
  main:
    args:
    - x
    - h0
    nodes:
    - id: recurrent_scan
      expr: scan(cell,x,h0)
    return: '{''output'':recurrent_scan[0],''final_h'':recurrent_scan[1]}'
state_contract: State is explicit in function arguments and scan carry. Parameters shared over time; different prefixes
  are distinct resources.
candidate_origin: LOCAL_YAML_REALIZATION_NO_EXTERNAL_GENERATION
common_schema_status: LOCAL_EXTENSION_NOT_COMMON_V0_3_PASS
stable_component_ids:
- cell/input_affine
- cell/recurrent_affine
- cell/hidden
- main/recurrent_scan
operator_semantics: ../operator_profile.yaml
components:
  cell/input_affine:
    function: cell
    node: input_affine
  cell/recurrent_affine:
    function: cell
    node: recurrent_affine
  cell/hidden:
    function: cell
    node: hidden
  main/recurrent_scan:
    function: main
    node: recurrent_scan

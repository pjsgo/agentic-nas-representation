representation_version: "0.2"
operator_profile: pytorch_nn_2_2_1_v0_2
architecture: BasicBlock

factors:
  block:
    contains: [main, merge, activation]
  main:
    contains: [conv1, bn1, relu, conv2, bn2]

  conv1:
    operator: conv2d
    attributes:
      in_channels: 64
      out_channels: 64
      kernel_size: 3
      stride: 1
      padding: 1
      dilation: 1
      groups: 1
      bias: false
      padding_mode: zeros
  bn1:
    operator: batch_norm2d
    attributes:
      num_features: 64
      eps: 1.0e-5
      momentum: 0.1
      affine: true
      track_running_stats: true
  relu:
    operator: relu
    attributes: {inplace: true, target: input}

  conv2:
    operator: conv2d
    attributes:
      in_channels: 64
      out_channels: 64
      kernel_size: 3
      stride: 1
      padding: 1
      dilation: 1
      groups: 1
      bias: false
      padding_mode: zeros
  bn2:
    operator: batch_norm2d
    attributes:
      num_features: 64
      eps: 1.0e-5
      momentum: 0.1
      affine: true
      track_running_stats: true

  merge:
    operator: add
    attributes: {inplace: true, target: main}
  activation:
    operator: relu
    attributes: {inplace: true, target: input}

dataflow:
  - [x, main.input]
  - [main.input, conv1.input]
  - [conv1.output, bn1.input]
  - [bn1.output, relu.input]
  - [relu.output, conv2.input]
  - [conv2.output, bn2.input]
  - [bn2.output, main.output]
  - [main.output, merge.main]
  - [x, merge.shortcut]
  - [merge.output, activation.input]
  - [activation.output, y]

resource:
  conv1: conv1_module
  bn1: bn1_module
  relu: shared_relu_module
  conv2: conv2_module
  bn2: bn2_module
  activation: shared_relu_module

interface:
  block:
    input: {name: x, shape: [N, 64, H, W]}
    output: {name: y}
  merge:
    require: same_shape(main, shortcut)

representation_version: r1_expression_graph_v1
operator_profile: ../../docs/operator-profiles/rnn.yaml
architecture: gru_encoder_decoder
architecture_entry: main
scope: Cho 2014 Appendix A encoder/context bridge/conditional decoder hidden-state core
excluded:
- training/gradients
- tokenization/embedding lookup
- beam search
- full translation system
- original initializer fidelity
- maxout output head and factorized vocabulary classifier
interface:
  inputs:
    source: '[B,S,3]'
    target: '[B,T,3], first previous-token embedding zero'
  dtype: float64
  layout: batch,time,feature
  constraints: B,S,T>=1; H=5; CPU; eval; no in-place mutation
  outputs:
    output: '[B,T,5]'
    context: '[B,5]'
    encoder_final: '[B,5]'
    decoder_initial: '[B,5]'
    final_h: '[B,5]'
parameters:
  eWz:
  - 5
  - 3
  eUz:
  - 5
  - 5
  eWr:
  - 5
  - 3
  eUr:
  - 5
  - 5
  eWn:
  - 5
  - 3
  eUn:
  - 5
  - 5
  dWz:
  - 5
  - 3
  dUz:
  - 5
  - 5
  dCz:
  - 5
  - 5
  dWr:
  - 5
  - 3
  dUr:
  - 5
  - 5
  dCr:
  - 5
  - 5
  dWn:
  - 5
  - 3
  dUn:
  - 5
  - 5
  dCn:
  - 5
  - 5
  V:
  - 5
  - 5
  Vp:
  - 5
  - 5
functions:
  encoder_cell:
    args:
    - x
    - h
    nodes:
    - id: z
      expr: sigmoid(linear(x,p['eWz'])+linear(h,p['eUz']))
    - id: r
      expr: sigmoid(linear(x,p['eWr'])+linear(h,p['eUr']))
    - id: proposal
      expr: tanh(linear(x,p['eWn'])+linear(r*h,p['eUn']))
    - id: hidden
      expr: z*h+(1-z)*proposal
    return: (hidden, hidden)
  decoder_cell:
    args:
    - x
    - h
    - context
    nodes:
    - id: z
      expr: sigmoid(linear(x,p['dWz'])+linear(h,p['dUz'])+linear(context,p['dCz']))
    - id: r
      expr: sigmoid(linear(x,p['dWr'])+linear(h,p['dUr'])+linear(context,p['dCr']))
    - id: proposal
      expr: tanh(linear(x,p['dWn'])+r*(linear(h,p['dUn'])+linear(context,p['dCn'])))
    - id: hidden
      expr: z*h+(1-z)*proposal
    return: (hidden, hidden)
  main:
    args:
    - source
    - target
    nodes:
    - id: encoder_scan
      expr: scan(encoder_cell,source,zeros(source,5))
    - id: fixed_context
      expr: tanh(linear(encoder_scan[1],p['V']))
    - id: decoder_initial
      expr: tanh(linear(fixed_context,p['Vp']))
    - id: decoder_scan
      expr: 'scan(lambda x,h: decoder_cell(x,h,fixed_context),target,decoder_initial)'
    return: '{''output'':decoder_scan[0],''context'':fixed_context,''decoder_initial'':decoder_initial,''encoder_final'':encoder_scan[1],''final_h'':decoder_scan[1]}'
state_contract: State is explicit in function arguments and scan carry. Parameters shared over time; different prefixes
  are distinct resources.
candidate_origin: LOCAL_YAML_REALIZATION_NO_EXTERNAL_GENERATION
common_schema_status: LOCAL_EXTENSION_NOT_COMMON_V0_3_PASS
stable_component_ids:
- encoder_cell/z
- encoder_cell/r
- encoder_cell/proposal
- encoder_cell/hidden
- decoder_cell/z
- decoder_cell/r
- decoder_cell/proposal
- decoder_cell/hidden
- main/encoder_scan
- main/fixed_context
- main/decoder_initial
- main/decoder_scan
operator_semantics: ../operator_profile.yaml
components:

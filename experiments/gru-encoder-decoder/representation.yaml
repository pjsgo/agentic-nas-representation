    node: z
  decoder_cell/r:
    function: decoder_cell
    node: r
  decoder_cell/proposal:
    function: decoder_cell
    node: proposal
  decoder_cell/hidden:
    function: decoder_cell
    node: hidden
  main/encoder_scan:

representation_version: r1_expression_graph_v1
architecture: luong_attention
architecture_entry: main
scope: Global/general bilinear attention after LSTM update, attentional vector and recurrent input feeding
excluded:
- training/gradients
- tokenization/embedding lookup
- beam search
- full translation system
- original initializer fidelity
- local-m/local-p/dot/concat/location alternatives
- encoder execution and vocabulary projection
- stacked decoder layers
interface:
  inputs:
    memory: '[B,S,5], supplied encoder sequence'
    mask: '[B,S] bool'
    target: '[B,T,3]'
    h0: '[B,5]'
    c0: '[B,5]'
    feed0: '[B,5], initial attentional feed; normally zero'
  dtype: float64
  layout: batch,time,feature
  constraints: B,S,T>=1; H=5; CPU; eval; no in-place mutation
  outputs:
    output: '[B,T,5] attentional vector'
    context: '[B,T,5]'
    weights: '[B,T,S]'
    hidden: '[B,T,5]'
    final_h: '[B,5]'
    final_c: '[B,5]'
    final_feed: '[B,5]'
parameters:
  dwi:
  - 20
  - 8
  dwh:
  - 20
  - 5
  dbi:
  - 20
  dbh:
  - 20
  Wa:
  - 5
  - 5
  Wc:
  - 5
  - 10
functions:
  decoder_step:
    args:
    - x
    - state
    - memory
    - mask
    nodes:
    - id: input_feeding
      expr: cat((x,state[2]))
    - id: recurrent_update
      expr: lstm(input_feeding,state[:2],p['dwi'],p['dwh'],p['dbi'],p['dbh'])
    - id: general_scores
      expr: (linear(memory,p['Wa'])*recurrent_update[0][:,None,:]).sum(dim=-1)
    - id: weights
      expr: masked_softmax(general_scores,mask)
    - id: context
      expr: (weights[:,:,None]*memory).sum(dim=1)
    - id: attentional_vector
      expr: tanh(linear(cat((context,recurrent_update[0])),p['Wc']))
    return: ((attentional_vector,context,weights,recurrent_update[0]),(recurrent_update[0],recurrent_update[1],attentional_vector))
  main:
    args:
    - memory
    - mask
    - target
    - h0
    - c0
    - feed0
    nodes:
    - id: decoder_scan
      expr: 'scan(lambda x,s: decoder_step(x,s,memory,mask),target,(h0,c0,feed0))'
    return: '{''output'':decoder_scan[0][0],''context'':decoder_scan[0][1],''weights'':decoder_scan[0][2],''hidden'':decoder_scan[0][3],''final_h'':decoder_scan[1][0],''final_c'':decoder_scan[1][1],''final_feed'':decoder_scan[1][2]}'
state_contract: State is explicit in function arguments and scan carry. Parameters shared over time; different prefixes
  are distinct resources.
candidate_origin: LOCAL_YAML_REALIZATION_NO_EXTERNAL_GENERATION
common_schema_status: LOCAL_EXTENSION_NOT_COMMON_V0_3_PASS
variant: global/general + input-feeding; one decoder LSTM layer
stable_component_ids:
- decoder_step/input_feeding
- decoder_step/recurrent_update
- decoder_step/general_scores
- decoder_step/weights
- decoder_step/context
- decoder_step/attentional_vector
- main/decoder_scan
components:
  decoder_step/input_feeding:
    function: decoder_step
    node: input_feeding
  decoder_step/recurrent_update:
    function: decoder_step
    node: recurrent_update
  decoder_step/general_scores:
    function: decoder_step
    node: general_scores
  decoder_step/weights:
    function: decoder_step
    node: weights
  decoder_step/context:
    function: decoder_step
    node: context
  decoder_step/attentional_vector:
    function: decoder_step
    node: attentional_vector
  main/decoder_scan:
    function: main
    node: decoder_scan

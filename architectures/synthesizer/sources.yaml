reconciliation:
- Paper writes head-indexed functions. This reconstruction selects the concrete official
  shared-pi parameterization, not an invented independent W2 for every head.
- w1 is official q kernel, wv is official kv kernel used only as values, wo is output
  kernel, w2 is pi kernel. Flattened official head dimensions are exposed as explicit
  H,D axes.
- D is both hidden and value width; output width equals input M. H>=2 avoids the official
  singleton-head dimension omission corner. num_memory_heads=0.
- L is configurable as in synthetic_attention(max_length); toy cases use smaller L
  without removing N<=L.
- Explicit bool mask with -inf is a local equation contract in place of official finite
  negative visibility bias. All-masked rows are rejected. Relative biases are excluded.
- Float64 CPU equations use effective supplied weights with fold_scaling_into_initializer=true,
  unit_scaling_convention=false. No initialization or official dtype parity claim.

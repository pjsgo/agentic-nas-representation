paper_code_differences:
- Author code DenseLayer3DInput has trainable bias by default; paper explicitly specifies
  no bias. Selected scope follows paper, not arbitrary trained author checkpoint behavior.
- Author Softmax3D replaces masked logits with -1e36. Selected exact valid-token softmax
  uses -inf and rejects all-masked inputs; no universal equality claim for finite-sentinel
  extreme logits.
- Author annotations internally use B,T,R; returned attention here is B,R,T, matching
  paper matrix orientation.
- Dropout, BiLSTM, downstream MLP and penalty are outside this scope.
adaptations:
- CPU float64, arbitrary positive supplied feature width D, rather than computing
  a 2u-wide BiLSTM output
- Padded hidden entries zeroed for deterministic diagnostic tensors; only valid values
  contribute
- Parameters supplied by caller; no training or initialization-distribution claim

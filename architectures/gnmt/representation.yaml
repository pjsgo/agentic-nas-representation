representation_version: r1_expression_graph_v1
architecture: gnmt
architecture_entry: main
scope: 'Small 3-layer GNMT encoder/decoder: bidirectional bottom encoder, 2 uni layers, top residual, bottom decoder
  additive attention, previous context broadcast to upper layers'
excluded:
- training/gradients
- tokenization/embedding lookup
- beam search
- full translation system
- original initializer fidelity
- 8-layer/1024-wide configuration
- gnmt_v2 current-attention broadcast alternative
- wordpieces
- quantization
- length/coverage beam penalties
- multi-GPU placement
- padding/variable lengths within a batch
- vocabulary projection/softmax
interface:
  inputs:
    source: '[B,S,3], unpadded'
    target: '[B,T,3], teacher-forced'
  dtype: float64
  layout: batch,time,feature
  constraints: B,S,T>=1; H=5; CPU; eval; no in-place mutation
  outputs:
    output: '[B,T,5] residual top output, before vocabulary projection'
    context: '[B,T,5]'
    weights: '[B,T,S]'
    bottom_hidden: '[B,T,5]'
    memory: '[B,S,5]'
    decoder_initial: ((h,c),(h,c),(h,c),attention), each [B,5]
    final_state: ((h,c),(h,c),(h,c),attention), each [B,5]

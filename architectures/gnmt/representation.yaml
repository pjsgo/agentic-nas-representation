functions:
  ef_cell:
    args:
    - x
    - state
    nodes:
    - id: lstm_state
      expr: lstm(x,state,p['efwi'],p['efwh'],p['efbi'],p['efbh'])
    return: (lstm_state[0],lstm_state)
  eb_cell:
    args:
    - x
    - state
    nodes:
    - id: lstm_state
      expr: lstm(x,state,p['ebwi'],p['ebwh'],p['ebbi'],p['ebbh'])
    return: (lstm_state[0],lstm_state)
  e2_cell:
    args:
    - x
    - state
    nodes:
    - id: lstm_state
      expr: lstm(x,state,p['e2wi'],p['e2wh'],p['e2bi'],p['e2bh'])
    return: (lstm_state[0],lstm_state)
  e3_cell:
    args:
    - x
    - state
    nodes:
    - id: lstm_state
      expr: lstm(x,state,p['e3wi'],p['e3wh'],p['e3bi'],p['e3bh'])
    return: (lstm_state[0],lstm_state)
  d1_cell:
    args:
    - x
    - state
    nodes:
    - id: lstm_state
      expr: lstm(x,state,p['d1wi'],p['d1wh'],p['d1bi'],p['d1bh'])
    return: (lstm_state[0],lstm_state)
  d2_cell:
    args:
    - x
    - state
    nodes:
    - id: lstm_state
      expr: lstm(x,state,p['d2wi'],p['d2wh'],p['d2bi'],p['d2bh'])
    return: (lstm_state[0],lstm_state)
  d3_cell:
    args:
    - x
    - state
    nodes:
    - id: lstm_state
      expr: lstm(x,state,p['d3wi'],p['d3wh'],p['d3bi'],p['d3bh'])
    return: (lstm_state[0],lstm_state)
  additive_attention:
    args:
    - query
    - memory
    - mask
    nodes:
    - id: energy
      expr: linear(tanh(linear(query,p['aW'])[:,None,:]+linear(memory,p['aU'])),p['av']).squeeze(-1)
    - id: weights
      expr: masked_softmax(energy,mask)
    - id: context
      expr: (weights[:,:,None]*memory).sum(dim=1)
    return: (context,weights,energy)
  decoder_step:
    args:
    - x
    - state
    - memory
    - mask
    nodes:
    - id: bottom
      expr: d1_cell(cat((x,state[3])),state[0])
    - id: alignment
      expr: additive_attention(bottom[0],memory,mask)
    - id: middle
      expr: d2_cell(cat((bottom[0],state[3])),state[1])
    - id: top
      expr: d3_cell(cat((middle[0],state[3])),state[2])
    - id: residual_output
      expr: top[0]+middle[0]
    return: ((residual_output,alignment[0],alignment[1],bottom[0]),(bottom[1],middle[1],top[1],alignment[0]))
  main:
    args:
    - source
    - target
    nodes:
    - id: zero
      expr: zeros(source,5)
    - id: forward_encoder
      expr: scan(ef_cell,source,(zero,zero))
    - id: backward_encoder
      expr: scan(eb_cell,source,(zero,zero),reverse=True)
    - id: bidirectional_concat
      expr: cat((forward_encoder[0],backward_encoder[0]))
    - id: middle_encoder
      expr: scan(e2_cell,bidirectional_concat,(zero,zero))
    - id: top_encoder
      expr: scan(e3_cell,middle_encoder[0],(zero,zero))
    - id: encoder_residual
      expr: top_encoder[0]+middle_encoder[0]
    - id: encoder_state_bridge
      expr: (backward_encoder[1],middle_encoder[1],top_encoder[1],zero)
    - id: mask
      expr: source[:,:,0]==source[:,:,0]
    - id: decoder_scan
      expr: 'scan(lambda x,s: decoder_step(x,s,encoder_residual,mask),target,encoder_state_bridge)'
    return: '{''output'':decoder_scan[0][0],''context'':decoder_scan[0][1],''weights'':decoder_scan[0][2],''bottom_hidden'':decoder_scan[0][3],''memory'':encoder_residual,''decoder_initial'':encoder_state_bridge,''final_state'':decoder_scan[1]}'
state_contract: State is explicit in function arguments and scan carry. Parameters shared over time; different prefixes
  are distinct resources.

included: 'Small 3-layer GNMT encoder/decoder: bidirectional bottom encoder, 2 uni layers, top residual, bottom
  decoder additive attention, previous context broadcast to upper layers'
excluded:
- training/gradients
- tokenization/embedding lookup
- beam search
- full translation system
- original initializer fidelity
- 8-layer/1024-wide configuration
- gnmt_v2 current-attention broadcast alternative
- wordpieces
- quantization
- length/coverage beam penalties
- multi-GPU placement
- padding/variable lengths within a batch
- vocabulary projection/softmax
adaptations:
- Reduced depth preserves a bidirectional layer, width-changing uni layer and residual uni layer.
- Decoder top residual adds lower hidden output only, never context; raw recurrent h/c are carried.
- Completed LSTM code reused; effective supplied biases absorb TensorFlow forget_bias=1 and map IFGO ordering.
- Official tutorial variant is specified explicitly, not a claim to reproduce the proprietary 2016 production system.
reference_kind: independent NumPy equation transcription, not upstream project execution

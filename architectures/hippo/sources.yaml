selection:
  measure: uniform probability measure on growing interval [0,t]
  basis: orthonormal shifted Legendre polynomials; no tilting
  variant: vanilla HiPPO_LegS, measure=legs, discretization=bilinear, sequential
  sign: Paper Theorem 2 has positive A with leading minus; official transition returns
    negative generator, used here.
  discretization_difference: Official constructor uses At=A/k and Bt=B/k at k=1..max_length,
    with the same k in both sides of the bilinear solve. Appendix B.3 instead displays
    unequal k and k+1 endpoints. This restoration deliberately follows the official
    constructor, and does not claim equality to that appendix recurrence.
  initialization: zero coefficients before k=1; no singular t=0 ODE evaluation
  adapters: CPU float64 instead of official float32 tensor casts. Batch-time-channel
    layout, external initial state and sample offset added explicitly for continuation.
    A/B registered fixed buffers; official A_stacked/B_stacked are plain attributes.
    No learned parameters. Per-call discrete matrices returned for contract inspection.
genealogy:
  pdf: /mnt/data/beyond_transformer_slides.pdf
  reviewed_image: ../slide_43_0.jpg
  page: 43
  observations: HiPPO (2020) connects to LSSL (2021) via C 048; LSSL to S4 via A 049.
  interpretation: Diagram names the general HiPPO family, not a unique measure. LegS
    is the explicitly selected representative, not the entire family or HiPPO-RNN.
reuse:
  lssl: /workspace/agentic-nas-representation/architectures/lssl/representation.yaml
  s4: /workspace/agentic-nas-representation/architectures/s4/representation.yaml
  relation: /workspace/agentic-nas-representation/relations/tr_049.yaml
  differences: Existing LSSL shares the fixed LegS A/B but uses learned constant per-channel
    dt, LTI recurrence and C/D readout. Existing S4 uses restricted conjugate rank-one
    DPLR coordinates. Neither is this 1/k coefficient recurrence. No state migration,
    complete-model equivalence, or new relation completion is claimed.
  numerical_reruns: 0

representation_version: local_tr061_v1
operator_profile: local_tr061_v1_not_common_schema
architecture: selective_state_layer_pre_gate
architecture_entry: unit
description: Agent-authored partial tr_061 realization; post-conv input to pre-gate
  output. See scope.yaml.
factors:
  unit:
    contains:
    - selection
    - selective_scan
    - f0170
    - f0171
    - f0172
  f0170:
    operator: unsqueeze
    attributes:
      dim: 2
  f0171:
    operator: mul
  f0172:
    operator: add
    attributes:
      inplace: false
  selection:
    operator: local_select
    attributes:
      channels: 1
      state_size: 2
      dt_rank: 1
      split_order:
      - dt
      - B
      - C
      delta_activation: softplus_after_bias
  selective_scan:
    operator: local_selective_scan
    attributes:
      A: negative_exp
      discrete_A: exp_delta_A
      discrete_B: delta_B
      readout: updated_state
      axis: 2
parameters:
  p6:
    shape:
    - 1
    - 1
    dtype: float32
    requires_grad: true
    initialization: fixture_supplied
  A_log:
    shape:
    - 1
    - 2
    dtype: float32
    requires_grad: true
    initialization: fixture_supplied
  x_weight:
    shape:
    - 5
    - 1
    dtype: float32
    requires_grad: true
    initialization: fixture_supplied
  dt_weight:
    shape:
    - 1
    - 1
    dtype: float32
    requires_grad: true
    initialization: fixture_supplied
  dt_bias:
    shape:
    - 1
    dtype: float32
    requires_grad: true
    initialization: fixture_supplied
dataflow:
- - parameters.p6
  - f0170.input
- - unit.u
  - f0171.left
- - f0170.output
  - f0171.right
- - f0171.output
  - f0172.shortcut
- - f0172.output
  - unit.y
- - unit.u
  - selection.u
- - parameters.x_weight
  - selection.x_weight
- - parameters.dt_weight
  - selection.dt_weight
- - parameters.dt_bias
  - selection.dt_bias
- - unit.u
  - selective_scan.u
- - unit.h0
  - selective_scan.h0
- - parameters.A_log
  - selective_scan.A_log
- - selection.delta
  - selective_scan.delta
- - selection.B
  - selective_scan.B
- - selection.C
  - selective_scan.C
- - selective_scan.sequence
  - f0172.main
- - selective_scan.sf
  - unit.h_final
interface:
  unit:
    inputs:
      u: &id001
        shape:
        - B
        - 1
        - T
        axes:
        - axis0
        - axis1
        - axis2
        dtype: float32
      h0: &id002
        shape:
        - B
        - 1
        - 2
        axes:
        - axis0
        - axis1
        - axis2
        dtype: float32
    outputs:
      y: *id001
      h_final: *id002
  selection:
    inputs:
      u: *id001
      x_weight:
        shape:
        - 5
        - 1
        axes:
        - axis0
        - axis1
        dtype: float32
      dt_weight:
        shape:
        - 1
        - 1
        axes:
        - axis0
        - axis1
        dtype: float32
      dt_bias:
        shape:
        - 1
        axes:
        - axis0
        dtype: float32
    outputs:
      delta: *id001
      B: &id003
        shape:
        - B
        - T
        - 2
        axes:
        - axis0
        - axis1
        - axis2
        dtype: float32
      C: *id003
  selective_scan:
    inputs:
      u: *id001
      h0: *id002
      A_log:
        shape:
        - 1
        - 2
        axes:
        - axis0
        - axis1
        dtype: float32
      delta: *id001
      B: *id003
      C: *id003
    outputs:
      sequence: *id001
      sf: *id002
  f0170:
    inputs:
      input:
        shape:
        - 1
        - 1
        axes:
        - axis0
        - axis1
        dtype: float32
    outputs:
      output:
        shape:
        - 1
        - 1
        - 1
        axes:
        - axis0
        - axis1
        - axis2
        dtype: float32
  f0171:
    inputs:
      left: &id004
        shape:
        - B
        - 1
        - T
        axes:
        - axis0
        - axis1
        - axis2
        dtype: float32
      right:
        shape:
        - 1
        - 1
        - 1
        axes:
        - axis0
        - axis1
        - axis2
        dtype: float32
    outputs:
      output: *id004
  f0172:
    inputs:
      main: &id005
        shape:
        - B
        - 1
        - T
        axes:
        - axis0
        - axis1
        - axis2
        dtype: float32
      shortcut: *id005
    outputs:
      output: *id005
state:
  selective_state:
    shape:
    - B
    - 1
    - 2
    axes:
    - axis0
    - axis1
    - axis2
    initial: external
dependency:
  unit.y:
  - unit.u
  - unit.h0
  - parameters.p6
  - parameters.A_log
  - parameters.x_weight
  - parameters.dt_weight
  - parameters.dt_bias
  unit.h_final:
  - unit.u
  - unit.h0
  - parameters.A_log
  - parameters.x_weight
  - parameters.dt_weight
  - parameters.dt_bias

representation_version: 0.3-candidate.1
operator_profile: tensor_pytorch_2_2_1_v0_3_r1
architecture: selective_state_subunit
architecture_entry: entry
factors:
  entry:
    contains:
    - delta_positive
    - delta_layout
    - rates_exp
    - rates_negative
    - rates_batch
    - rates_time
    - delta_state
    - decay_argument
    - decay
    - B_channel
    - discrete_B
    - u_state
    - drive
    - recurrence
    - D_batch
    - D_time
    - skip
    - pre_gate
    - gate_activation
    - gated
  step:
    contains:
    - retained
    - updated
    - C_column
    - readout_product
    - readout_vector
  delta_positive:
    operator: softplus
    attributes:
      beta: 1
      threshold: 20
  delta_layout:
    operator: transpose
    attributes:
      dim0: 1
      dim1: 2
  rates_exp:
    operator: exp
  rates_negative:
    operator: neg
  rates_batch:
    operator: unsqueeze
    attributes:
      dim: 0
  rates_time:
    operator: unsqueeze
    attributes:
      dim: 2
  delta_state:
    operator: unsqueeze
    attributes:
      dim: 3
  decay_argument:
    operator: mul
  decay:
    operator: exp
  B_channel:
    operator: unsqueeze
    attributes:
      dim: 1
  discrete_B:
    operator: mul
  u_state:
    operator: unsqueeze
    attributes:
      dim: 3
  drive:
    operator: mul
  recurrence:
    scan:
      body: step
      axis: 2
      direction: forward
      sequence_inputs:
        decay_t:
          input: decay_sequence
          axis: 2
        drive_t:
          input: drive_sequence
          axis: 2
        C_t:
          input: C_sequence
          axis: 1
      invariant_inputs: {}
      carries:
        ssm:
          input: initial
          body_input: previous
          body_output: next
          output: final
      emits:
        readouts:
          body_output: readout
          axis: 2
      empty: return_initial
  retained:
    operator: mul
  updated:
    operator: add
    attributes:
      inplace: false
  C_column:
    operator: unsqueeze
    attributes:
      dim: 2
  readout_product:
    operator: matmul
  readout_vector:
    operator: squeeze
    attributes:
      dim: 2
  D_batch:
    operator: unsqueeze
    attributes:
      dim: 0
  D_time:
    operator: unsqueeze
    attributes:
      dim: 2
  skip:
    operator: mul
  pre_gate:
    operator: add
    attributes:
      inplace: false
  gate_activation:
    operator: silu
  gated:
    operator: mul
dataflow:
- - entry.delta_logits
  - delta_positive.input
- - delta_positive.output
  - delta_layout.input
- - parameters.p_A_log
  - rates_exp.input
- - rates_exp.output
  - rates_negative.input
- - rates_negative.output
  - rates_batch.input
- - rates_batch.output
  - rates_time.input
- - delta_layout.output
  - delta_state.input
- - rates_time.output
  - decay_argument.left
- - delta_state.output
  - decay_argument.right
- - decay_argument.output
  - decay.input
- - entry.B
  - B_channel.input
- - delta_state.output
  - discrete_B.left
- - B_channel.output
  - discrete_B.right
- - entry.u
  - u_state.input
- - discrete_B.output
  - drive.left
- - u_state.output
  - drive.right
- - decay.output
  - recurrence.decay_sequence
- - drive.output
  - recurrence.drive_sequence
- - entry.C
  - recurrence.C_sequence
- - entry.initial_state
  - recurrence.initial
- - step.decay_t
  - retained.left
- - step.previous
  - retained.right
- - retained.output
  - updated.main
- - step.drive_t
  - updated.shortcut
- - step.C_t
  - C_column.input
- - updated.output
  - readout_product.left
- - C_column.output
  - readout_product.right
- - readout_product.output
  - readout_vector.input
- - updated.output
  - step.next
- - readout_vector.output
  - step.readout
- - parameters.p_D
  - D_batch.input
- - D_batch.output
  - D_time.input
- - entry.u
  - skip.left
- - D_time.output
  - skip.right
- - recurrence.readouts
  - pre_gate.main
- - skip.output
  - pre_gate.shortcut
- - entry.gate
  - gate_activation.input
- - pre_gate.output
  - gated.left
- - gate_activation.output
  - gated.right
- - gated.output
  - entry.output
- - recurrence.final
  - entry.final_state

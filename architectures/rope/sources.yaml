adaptation:
  interface_boundary: Projected q,k,v are caller inputs. No trainable parameters inside
    core.
  layout: q B,Q,H,D; k B,K,H,D; v B,K,H,V; logits B,H,Q,K
  explicit_positions: Independent q and k position vectors use same origin and frequencies;
    lengths may differ. This is an equation-level generalization of the official same-length
    rotary branch, not an executed official cross-attention API.
  numeric_domain: CPU float64, bounded nonnegative integer positions. No mixed precision
    claim.

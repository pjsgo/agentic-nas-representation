source_mapping:
  rnn_lm_token_map: Equations (1)-(2), one-hot word concatenated with previous hidden
    state. A[v,j]=u[j,v].
  rnn_lm_recurrent: Equations (2),(4); R[k,j]=u[j,V+k], sigmoid. Explicit sums have
    no added biases.
  rnn_lm_readout: Equation (3); O[j,k]=v[k,j], applied to current updated hidden state.
  rnn_lm_softmax: Equation (5), flat full-vocabulary normalization; not later class-based
    toolkit.
  rnn_lm_carry: Section2 context propagation; supplied h0 exposes source small-value
    initialization and streaming continuation.
local_adaptations:
- Independent batches, float64 CPU and diagnostics for unit comparison.
- Token lookup replaces dense one-hot multiplication exactly; no separate embedding/projection
  factorization.
- Initial state supplied explicitly; no implicit sentence reset or OOV sentinel.
- Stable sigmoid and subtract-max softmax, without toolkit clipping/approximate exponential.
- Invalid-input guards and copied final-state output are local interface requirements.
source_runtime_parity: NOT_RUN

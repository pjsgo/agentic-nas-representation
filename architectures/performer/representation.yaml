  - performer_key_projected
- - omega
  - performer_key_projected
- - performer_key_scaled
  - performer_key_square
- - performer_key_square
  - performer_key_norm
- - performer_key_norm
  - performer_key_half_norm
- - performer_key_projected
  - performer_key_shift
- - performer_key_projected
  - performer_key_centered
- - performer_key_half_norm
  - performer_key_centered
- - performer_key_centered
  - performer_key_stable
- - performer_key_shift
  - performer_key_stable
- - performer_key_stable
  - performer_key_exp
- - performer_key_exp
  - performer_key_epsilon
- - performer_key_epsilon
  - performer_key_features
- - omega
  - performer_key_features
- - performer_key_features
  - performer_kv_summary
- - v
  - performer_kv_summary
- - performer_key_features
  - performer_key_sum
- - performer_query_features
  - performer_numerator
- - performer_kv_summary
  - performer_numerator
- - performer_query_features
  - performer_denominator
- - performer_key_sum
  - performer_denominator
- - performer_denominator
  - performer_denominator_column
- - performer_numerator
  - performer_output
- - performer_denominator_column
  - performer_output
outputs:
- performer_output
- performer_query_features
- performer_key_features
- performer_denominator
resources:
  omega:
    kind: buffer
    shape: '[M,D]'
    sharing: same fixed matrix for Q/K, all batches and heads
    update: none; supplied block-orthogonal Gaussian fixture; no redraw
state:
  recurrent: false
  mutation: false
variant: Noncausal FAVOR+ stabilized positive softmax features; epsilon=1e-6 inside feature map
scope:
  included:
  - D^(-1/4) normalization
  - fixed random feature map
  - linear associative normalized aggregation
  excluded:
  - full Transformer blocks
  - QKV and output feature projections
  - training
  - dropout
  - original class hierarchy
  - performance claims
  - exact softmax equivalence
  - causal scan
  - random redraw schedule
  - random number generator bit identity

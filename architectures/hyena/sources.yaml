  - 68
  limitation: No explicit Hyena node or edge was verified on these genealogy images;
    no new slide edge or relation ID is invented. Target selection is explicitly user
    requested. Algorithmic evidence comes from the original paper and official repository.
  related_baseline: H3, LSSL and S4 records are reused as existing context, without
    reexecution or an equivalence claim.
independent_reference:
  method: Independently rebuilt positional features and decay rates; scalar affine
    and sine operations; explicit lag-by-lag causal convolution
  independence: no candidate, torch, source or FFT imports; no shared core implementation

selection:
  variant: Official simplified standalone HyenaOperator; not the complete src/models/sequence/hyena.py
    variant
  order: 2 or 3; order input gates, order-1 long convolutions, final gate x[0]
  paper_correspondence: Paper formal order N recurrence and Algorithm 3 present N
    long filters. The selected standalone source instead uses order-1 long-filter
    stages together with depthwise short filtering. Preserve actual source convention;
    no equality to every paper order convention is claimed.
  dimensions: D=1..8, width=1..16, l_max=2..32; tiny validation sizes, not a performance
    limit of Hyena
  explicit_options: emb_dim=5, num_inner_mlps=2, lr_pos_emb=0, modulation_lr=0, shift=0.05,
    normalized=false, all dropout=0
  filter_generator: Fixed full-horizon time and complex-exponential position grid,
    three affine/sine layers sharing one trainable frequency vector, final biasless
    linear map
  modulation: Fixed exponentially decaying rates from log(0.01)/1.5 to log(0.01)/0.3,
    absolute rates, additive window shift 0.05
  convolution: Causal short depthwise cross-correlation with width 3; long zero-padded
    FFT convolution plus trainable diagonal skip
  normalization: No filter normalization. Candidate uses default forward FFT and 1/(2L)
    inverse FFT; algebraically equivalent to source filter FFT divided by 2L and unnormalized
    inverse FFT.
  boundary: Negative time is zero; retain first L outputs; L<=l_max required; no implicit
    truncation of longer inputs
  adapters: CPU float64 throughout, flattened parameter names, deterministic zero
    initialization except unit frequency followed by supplied weights. Fixed position/rate
    buffers are configuration derived, not external trainable filters. Returns generated
    filters and long-stage outputs for inspection. Upstream default learnable positional
    embeddings disabled using its lr_pos_emb=0 option. Parameter initialization statistics,
    optimizer metadata and float32 numerical rounding are not restored.
parameter_mapping:
  W_in_b_in: in_proj.weight/bias
  W_short_b_short: short_filter.weight/bias
  W0_b0: filter_fn.implicit_filter.0.weight/bias
  W1_b1: filter_fn.implicit_filter.2.weight/bias
  W2_b2: filter_fn.implicit_filter.4.weight/bias
  freq: shared act.freq at implicit_filter indices 1,3,5
  Wf: filter_fn.implicit_filter.6.weight
  Dskip: filter_fn.bias
  W_out_b_out: out_proj.weight/bias
  buffers: pos/time/deltas correspond to squeezed pos_emb.z/pos_emb.t/modulation.deltas
scope:
  included:
  - projections
  - short_filter
  - implicit_long_filter_generation
  - modulation
  - causal_convolution
  - data_dependent_gating
  - diagonal_skip
  excluded:
  - full_network
  - language_model_head
  - training
  - learned_positions
  - learned_decay_rates
  - full_repository_variant
  - fused_operators
  - throughput_benchmarks
  - source_bitwise_parity

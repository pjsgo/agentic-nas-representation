source_differences:
  - Source is float32; local mathematical fidelity comparison uses float64 throughout, not bitwise framework parity.
  - FFN output width scaling (H/D)^(-0.5) is retained explicitly. It is a pinned code choice, not asserted as a universal MoE requirement.
  - Lower expert index breaks tied logits in this local interface. No cross-framework tie-parity claim.
  - Noise and W_noise are omitted entirely. The inspected noisy branch uses (softplus(x W_noise)+0.01)*train as standard deviation; it is not executed here.
  - Dense diagnostic tensors for unselected expert pairs are filled with zero; official execution instead stores packed selected minibatches.
reference:
  implementation: reference.py
  method: Independent Python scalar loops, math.exp and explicit FFN sums from inspected equations
  independence: Does not import realization or share router, dispatch, softmax, FFN or combine helpers
  official_runtime_executed: false

source_mapping:
  lstmn_address: equation 4 with previous weighted hidden read and equation 5 softmax
  lstmn_read: equation 6 applies the same weights to hidden and cell tapes
  lstmn_gates: equation 7 uses concatenated current read hidden and token
  lstmn_update: equations 8-9 combine forget-gated read cell with proposal, then expose
    hidden output
scope_decisions:
- Separate aligned hidden and cell tapes hold every prior token state; attention accesses
  only past slots.
- Equation 4 carries the previous weighted hidden read, not the immediately previous
  hidden state.
- No biases added because displayed equations omit them; no claim that unavailable
  author code uses this exact parameterization.
- The paper does not fully specify empty-tape handling. This local boundary uses empty
  tapes and zero reads, with no sentinel; this is an explicit convention.
- A provided prefix and previous_read enable continuation; no memory cap is reached
  within the short declared scope.
- One shared set of five weight tensors across steps, all distinct from one another;
  no task output layer.
excluded:
- dataset_training
- task_heads
- token_embeddings
- multilayer_model
- shallow_fusion
- deep_fusion
- attention_write
- tape_truncation
- dropout
- gradients

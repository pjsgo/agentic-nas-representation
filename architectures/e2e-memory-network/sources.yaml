  repository: https://github.com/facebookarchive/MemNN
  commit: d7c5f6d5e1a4af6417ffff98535a96bb0947a6a8
  official_evidence: Paper footnote 2 links facebook/MemNN; archived repository README
    links Section 4 QA implementation.
  base_url: https://raw.githubusercontent.com/facebookarchive/MemNN/d7c5f6d5e1a4af6417ffff98535a96bb0947a6a8/

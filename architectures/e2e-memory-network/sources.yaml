source_mapping:
  memn2n_embed: MemoryBoW lookup and Sum(2); build_model query lookup and sum
  memn2n_address: MemoryBoW initQueryModule MatVecProd(true) then Softmax
  memn2n_read: MemoryBoW initOutputModule MatVecProd(false); Memory.fprop combines
    the two
  memn2n_update: build_model Duplicate, Parallel(memory, Identity), AddTable in nhops
    loop
  memn2n_answer: build_model LinearNB, Softmax and share_type==1 classifier tie
scope_decisions:
- Select supported use_bow=true, enable_time=false, share_type=1, add_proj=false,
  add_nonlin=false. This is not the default PE+TE config.
- Count-vector matrix multiplication replaces repeated lookup-and-sum exactly for
  unpadded BoW inputs.
- One E tensor holds K+1 distinct tables with adjacent usage and final classifier
  reuse. No padding or nil-token row is needed at this boundary.
- Float64 CPU formulas only; MATLAB runtime, source training state and initialization
  are not reproduced.
excluded:
- full_QA_dataset_training
- learned_query_transform
- position_encoding
- temporal_encoding
- memory_buffer_loader
- linear_start
- gradients
slides:
  source: /mnt/data/beyond_transformer_slides.pdf
  extraction: ../evidence/slides.txt
  inspected_pages:
  - 10
  - 11
  role: External memory lookup and progression into LSTMN; exact multi-hop equations
    come from paper and official code.

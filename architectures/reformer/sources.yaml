version_decisions:
  authority: 'Pinned official second implementation governs exact core calculations. Paper supplies provenance and comparison, not extra mask rules.'
  normalization: 'Source divides keys by sqrt(mean(qk^2)+1e-6), then sqrt(D). Queries remain unchanged. Do not replace this with an exact unit norm or normalize queries.'
  bucket_mask: 'The selected forward path does not test bucket equality. Sorted chunk neighbors may come from different buckets.'
  duplicates: 'No duplicate-count correction exists in the selected forward path. Every occurrence remains in chunk softmax and round merge, including repeats across rounds or across a round boundary.'
  paper_difference: 'Appendix A defines strict bucket sets and log N_ij duplicate correction. Neither is added to this later code profile. This reconstruction is not an exact implementation of paper equations 4 and 16.'
  round_boundary: 'look_adjacent rolls over all R*T/C chunks after globally sorting offset buckets. Previous-chunk lookup can cross a round boundary and wraps last-to-first globally.'
  self_and_causal: 'mask_self_attention subtracts 1e5 on equal original positions and 1e9 on future positions when causal. It does not replace self scores by a constant or use negative infinity.'
  merge: 'forward_unbatched restores each occurrence to round-major original order, then weights round outputs by exp(logsumexp_r-logsumexp_over_rounds). No arithmetic averaging.'
  numeric_port: 'Float64 CPU evaluation of selected formulas; upstream rotation generation casts float32. Fixed rotation input replaces RNG generation only, not hash or sorting. No bitwise JAX/runtime or RNG distribution equivalence claim.'
restoration_boundary:
  input: 'Already projected qk[T,D], v[T,Dv], rotations[D,R,K/2]'
  output: 'Merged attention values [T,Dv] before output projection'
  included: 'Angular hash, offset bucket/position sort, previous/current global chunks, key normalization, finite masks, occurrence softmax, inverse sort and multi-round merge'
  excluded: 'Projection matrices, full Reformer model, reversible residual, FFN chunking, training/backward, optimized kernels, padding, incremental cache, RNG state, factorized hashes and automatic bucket sizing'
  multi_round_feasibility: 'Included at R=2 and R=3 in small cases. No single-round-only fallback was necessary.'
part_mapping:
  reformer_hash_sort: 'hash_vecs; LSHSelfAttention.hash_vectors; forward_unbatched sort_key_val'
  reformer_chunk_connections: 'attend reshape; look_adjacent'
  reformer_score_mask: 'length_normalized; attend key scaling; mask_self_attention'
  reformer_chunk_attention: 'attend logsumexp, exp and value multiplication'
  reformer_restore_merge: 'forward_unbatched permute_via_gather/permute_via_sort and round probabilities'
reference_independence:
  candidate: 'Torch einsum, argsort, roll, gathered key/value tensors and weighted round outputs'
  reference: 'Python scalar dot products and first-maximum hash, tuple sorting, direct circular index enumeration, final softmax over the full multiset of occurrences'
  shared_computational_helpers: false
  evaluation: 'Three fixtures compare output and discrete hash/sort/connectivity plus round normalizers and weights. No dense-attention equality assumption.'

source_mapping:
  bytenet_norm1: Figure 3 left bottom LayerNorm at 2d width, section 3.6
  bytenet_reduce: Figure 3 left first ReLU then 1x1 convolution reducing 2d to d
  bytenet_norm2: Figure 3 left middle LayerNorm at d width
  bytenet_dilated: Figure 3 left middle ReLU then masked 1xk; sections 3.3-3.5 distinguish
    centered encoder and causal decoder; section 6 width k=3
  bytenet_norm3: Figure 3 left top LayerNorm at d width
  bytenet_expand: Figure 3 left top ReLU then 1x1 convolution restoring 2d
  bytenet_residual: Figure 3 left identity addition without post-add activation
local_conventions:
- Chosen ReLU translation block, not multiplicative-unit language-model block; same
  block shape supports centered and causal feature calculations.
- No encoder-to-decoder conditioning/stack connection, token embeddings or dynamic
  unfolding implemented. Two mode settings are separate feature stacks, not an end-to-end
  translator.
- Per-position affine LayerNorm uses population variance and epsilon 1e-5; original
  epsilon/affine initialization unavailable.
- Bias-free convolutions, zero convolution initialization and ones/zeros LN affine
  initialization are declared local choices.
- Current feature position is visible in causal mode; initial token shift belongs
  outside the input boundary.
validation_boundary:
  reference: Independent scalar channel normalization and indexed convolutions, no
    candidate or YAML imports
  realization: Manual YAML equation translation using PyTorch layer_norm and conv1d;
    not a generic YAML interpreter
  official_runtime_parity: NOT_RUN
  full_model: NOT_CLAIMED

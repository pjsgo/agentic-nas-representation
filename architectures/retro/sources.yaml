local_adaptations:
- Batch dimension and float64 CPU added; Listing 1 is unbatched simplified JAX.
- Returned diagnostics store neighbour then token axes; listing flattens token then
  neighbour. Identical joint sum with matching values.
- No multihead, RMSNorm, FFN, projection biases or hidden runtime scaling inferred.
- No padding slots; incomplete chunks rejected. All retrieved tokens, including continuation,
  are visible inside the eligible source window.

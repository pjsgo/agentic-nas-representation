selection:
  variant: QRNNLayer output_gate=True, zoneout=0, window in [1,2]
  gate_convention: Source F weights the new candidate; paper f weights old cell. Define
    update_gate=F_source=1-f_paper. With sigmoid, corresponding paper forget affine
    parameters are the negatives of source F parameters; identical raw weights are
    not equal computations.
  parameterization: Source biased linear on concat(current,previous), packed Z/F/O.
    W and b are effective linear weights.
  adapters:
  - Batch-first [B,T,I] instead of time-first
  - External prev_x and final_x instead of mutable detached prevX cache
  - Returned cell has shape [B,H] instead of [1,B,H]; final_output is exposed separately
  - Extra intermediate gates and cell trajectory exposed for inspection
  - CPU float64, deterministic zero parameter allocation followed by evaluator weight
    injection; source random initialization not reproduced
  - No automatic detach on history; backward behavior not certified
parts:
  qrnn_causal_window:
    source: qrnn.py:54-70
    meaning: current/previous feature concatenation and biased convolution-equivalent
      affine
  qrnn_gate_functions:
    source: qrnn.py:71-80,103
    meaning: packed tanh candidate and sigmoid update/output gates
  qrnn_fo_pooling:
    source: forget_mult.py:78-91; qrnn.py:99-103
    meaning: channelwise affine cell recurrence followed by output gating
  qrnn_external_state:
    source: qrnn.py:107-111
    meaning: explicit cell and input-history adapter; not hidden cache or output-feedback
      recurrence
scope_limit: One fo-pooling layer; no task model, training, zoneout, padding, GPU,
  performance or backward claim

scope:
  included: Multihead scalar-identity selective SSM; actual chunk-diagonal and low-rank offdiagonal contractions;
    chunk-boundary state; continuous-to-discrete scaling and D skip.
  excluded: input/output projections, convolution, gated RMSNorm, grouping, fused Triton/CUDA kernels, full network,
    training, performance claims.
  dimensions: two heads, three features per head, four state coordinates, ngroups=heads, positive lengths divisible
    by two
  stability_limit: Prefix subtraction matches official segsum_unstable; short float64 fixtures only, no long-sequence
    numerical stability claim.
  reference_independence: Independent NumPy scalar-head recurrence, no block algorithm or helpers shared with candidate.
    Not renamed prior Mamba code.
  distinction_from_mamba1: A has one scalar per head (not per channel/state diagonal); shared transition across
    P and N; candidate realizes SSD semiseparable block matrix algorithm.

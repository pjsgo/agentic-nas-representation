mapping:
  rwkv_shift: Paper equations 11-13 and RWKV_TimeMix.jit_func
  rwkv_project: Same equations; WKV.forward converts raw trainable decay to negative
    exponential
  rwkv_wkv: Paper equation 16 and Appendix D; kernel_forward and RWKV_RNN.SA
  rwkv_output: Paper equation 17 and RWKV_TimeMix.forward
state_contract:
  last_x: Previous time-mixer input, not previous output or channel-mixer input
  a_b: Scaled numerator and denominator; logical unscaled values are a*exp(p), b*exp(p),
    never materialized
  p: Common log scale selected by maximum; update includes decay of previous scale,
    read uses current-token bonus
  update_order: Read old summary and current bonus first; then decay old summary and
    insert current token without bonus
  scope_size: B*D previous-input scalars plus 3*B*C WKV scalars; channel-mixer state
    absent
adaptations:
- Row-vector matrices in [input,output] orientation, transpose of official Linear.weight
  storage
- CPU float64 and arbitrary small D,C supported by v4neo dim_att interface
- Empty state uses negative infinity instead of -1e30 in v4 SA or -1e38 in CUDA; same
  mathematical empty-history intent without finite sentinel artifacts
- Explicit caller-provided state and returned traces; official CUDA training kernel
  does not expose these arguments
- Caller supplies independent parameters; paper and code initialization details are
  excluded
included:
- token_shift
- time_mixing
- weighted_key_value
- current_bonus
- negative_exponential_decay
- sigmoid_receptance
- output_projection
- stabilized_state
- continuation
excluded:
- channel_mixing
- channel_state
- layernorm
- residual
- full_block
- full_model
- training
- CUDA_execution
- mixed_precision
- later_RWKV_versions
validation:
  independent_reference: Scalar interpolation and projections plus explicit weighted
    history enumeration at every prefix; no recursive a/b/p implementation and no
    candidate imports
  stability_case: Large positive and negative projected keys beyond direct float64
    exp range, compared using independent per-prefix max-shifted history sums
  source_runtime: NOT_EXECUTED; upstream imports would build CUDA kernels or depend
    on model checkpoints and training packages
  limitation: Equation-level v4 time mixer reconstruction, not official kernel bitwise
    parity or full RWKV restoration

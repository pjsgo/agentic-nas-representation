architecture: rwkv-v4
version_decision:
  selected: Original 2023 RWKV scalar per-channel WKV, RWKV-v4 family
  reasoning: Slide 43 labels RWKV as 2023 without a numbered variant. The original
    paper's time-mixing equations and Appendix D match the official RWKV-v4 SA and
    plain RWKV-v4neo RWKV_TimeMix branch.
  not_selected:
  - RWKV_TimeMix_RWKV5_Preview
  - RWKV_TimeMix_RWKV5
  - experimental_a_attention_branch
  - RWKV_v6
  - RWKV_v7
  limitation: Slide alone cannot identify a code revision. Version fixed by the paper's
    scalar WKV and matching versioned implementation directories, not by the current
    repository default model.
paper:
  url: https://arxiv.org/html/2305.13048v2
  version: arXiv:2305.13048v2, 2023-12-11; original submission 2023-05-22
  inspected: Section 3.1 equations 11-13 and 16-17; Appendix D equations 19-28
  role: Time interpolation, explicit exponential weighted history, receptance gating,
    stable recurrent state interpretation
slides:
  path: /mnt/data/beyond_transformer_slides.pdf
  page: 43
  evidence: ../slide_43_0.png
  inspection: Original embedded genealogy image visually read; RWKV node dated 2023
  limitation: No numeric version or mixer equations on this slide

source_mapping:
  wavenet_dilated_filter: Section 2.1 time-preserving dilated causal convolution;
    Eq 2 filter branch
  wavenet_dilated_gate: Section 2.1 and Eq 2 independent gate branch
  wavenet_gate: Section 2.3 Eq 2 tanh(filter) times sigmoid(gate)
  wavenet_residual: Section 2.4 Figure 4 1x1 projection and identity residual
  wavenet_skip: Section 2.4 Figure 4 parameterized skip from gated activation
  wavenet_skip_sum: Section 2.4 Figure 4 sum before output head
local_conventions:
- Internal supplied features; x[t] is visible. No raw-audio prediction indexing or
  initial shift is claimed.
- Width 2 selected; bias-free equation-level scope. Cross-correlation tap convention
  explicitly fixed.
- Independent residual and skip projections, caller-specified dilation tuple, no residual
  rescaling.
- Zero construction initialization and float64 fixtures are local evaluation contracts,
  not original training defaults.
validation_boundary:
  reference: Separate scalar Python sums, math.tanh and logistic; torch only input/output
    conversion
  realization: Manual translation of YAML equations into PyTorch pad/conv1d/tanh/sigmoid;
    not a generic YAML interpreter
  official_runtime_parity: NOT_RUN
  full_model: NOT_CLAIMED

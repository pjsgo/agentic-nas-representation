implementation_boundary:
  variant: sliding_chunks mathematical pattern, bidirectional, dilation=1, eval dropout=0
  candidate: enumerate distinct key indices, compute only selected rows
  reference: independent full dense pairwise masks and batched matrix products
  padding_adapter: public valid/global_mask correspond to official transformed mask
    negative/zero/positive; masked queries return zero
  mask_difference: Structural exclusion replaces official finite -10000 padding/global-slot
    masks. For declared float32 abs(x,parameters)<=2 and E<=8, logits magnitude is
    at most 34^2*sqrt(8)<3270; masked entries underflow relative to any valid key.
    Boundary out-of-range slots are omitted. Entire padded rows explicitly return
    zero.
  kernel_difference: no sliding_chunks layout, padding-to-window-multiple or TVM code;
    arbitrary sequence lengths realize the same restricted attention equations
  output_boundary: context_layer only; excludes surrounding Roberta output projection
    and original output_attentions format
  excludes:
  - full_encoder
  - training
  - gradients
  - dilation
  - autoregressive_mode
  - optimized_kernel
  - throughput
  - long_document_quality
